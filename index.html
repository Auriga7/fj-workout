<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<title>FJ · 健身工作台</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f; --bg-elev:#171717; --bg-card:#1c1c1c; --bg-soft:#222;
  --fg:#f5f5f5; --fg-dim:#a8a8a8; --fg-mute:#6e6e6e;
  --primary:#00ff88; --primary-dim:#00cc6e; --primary-soft:rgba(0,255,136,.12);
  --accent:#ff6b35; --accent-dim:#cc562a; --accent-soft:rgba(255,107,53,.15);
  --danger:#ff4d4d; --warn:#ffb020; --info:#4dabff;
  --border:#2a2a2a; --border-soft:#222;
  --radius:14px; --radius-sm:10px; --radius-lg:20px;
  --shadow:0 8px 30px rgba(0,0,0,.4);
  --font:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
[data-theme="light"]{
  --bg:#f5f5f5; --bg-elev:#ffffff; --bg-card:#ffffff; --bg-soft:#f0f0f0;
  --fg:#1a1a1a; --fg-dim:#555555; --fg-mute:#888888;
  --primary:#00cc6e; --primary-dim:#009e55; --primary-soft:rgba(0,204,110,.12);
  --accent:#ff6b35; --accent-dim:#cc562a; --accent-soft:rgba(255,107,53,.15);
  --danger:#ff4d4d; --warn:#ffb020; --info:#4dabff;
  --border:#e0e0e0; --border-soft:#eeeeee;
  --shadow:0 8px 30px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font); background:var(--bg); color:var(--fg);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--fg);background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input[type=checkbox],input[type=radio]{width:auto;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#444}

/* App Shell */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:220px;background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 12px;gap:4px;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px;border-bottom:1px solid var(--border);margin-bottom:10px}
.brand-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-logo svg{width:20px;height:20px;color:#000}
.brand-text{font-weight:800;font-size:16px;letter-spacing:-.3px}
.brand-text small{display:block;font-size:10px;color:var(--fg-mute);font-weight:500;margin-top:1px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);color:var(--fg-dim);font-weight:500;font-size:14px;transition:.15s;cursor:pointer;white-space:nowrap}
.nav-item:hover{background:var(--bg-soft);color:var(--fg)}
.nav-item.active{background:var(--primary-soft);color:var(--primary)}
.nav-item.active svg{color:var(--primary)}
.nav-item svg{width:20px;height:20px;flex-shrink:0;color:var(--fg-dim);transition:.15s}

.main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.content{max-width:920px;margin:0 auto;padding:18px 16px 96px}
.tabbar{
  position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(15,15,15,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:none;z-index:50;
}
.tabbar-inner{display:flex;height:100%;max-width:520px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg-mute);font-size:10px;font-weight:500;transition:.15s;padding:6px 2px}
.tab svg{width:20px;height:20px}
.tab.active{color:var(--primary)}
.tab.active svg{color:var(--primary)}

/* Page visibility */
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Common */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.header h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.header h1 .sub{font-size:12px;font-weight:500;color:var(--fg-mute);display:block;margin-top:2px}
.section-title{font-size:14px;font-weight:700;color:var(--fg-dim);margin:18px 0 10px;letter-spacing:.3px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.section-title:first-child{margin-top:0}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;min-width:0}
.card.dense{padding:10px}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:18px;height:18px;color:var(--primary)}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between;gap:8px}
.row.between > *:last-child{flex-shrink:0}
.row.between > *:first-child{min-width:0}
.card .row.between span,.card .row.between .dim{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .row.between > .row{min-width:0;flex-shrink:1;overflow:hidden}
.card .row.between .toggle{flex-shrink:0}
.card .row.between .tag{flex-shrink:0}
.col{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:10px;min-width:0}
.grid > *{min-width:0;overflow:hidden}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.muted{color:var(--fg-mute)}
.dim{color:var(--fg-dim)}
.primary{color:var(--primary)}
.accent{color:var(--accent)}
.big{font-size:24px;font-weight:800;letter-spacing:-.5px}
.huge{font-size:34px;font-weight:800;letter-spacing:-1px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--bg-soft);color:var(--fg-dim)}
.tag.primary{background:var(--primary-soft);color:var(--primary)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.danger{background:rgba(255,77,77,.15);color:var(--danger)}
.tag.warn{background:rgba(255,176,32,.15);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;background:var(--bg-soft);color:var(--fg);border:1px solid var(--border);transition:.15s;cursor:pointer}
.btn:hover{background:var(--bg-elev);border-color:#333}
.btn.primary{background:var(--primary);color:#000;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-dim)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.accent:hover{background:var(--accent-dim)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.lg{padding:12px 20px;font-size:14px}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.block{width:100%}
.btn svg{width:16px;height:16px}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;background:var(--bg-soft);border:1px solid var(--border);cursor:pointer}
.icon-btn:hover{background:var(--bg-elev)}
.icon-btn svg{width:18px;height:18px}
.label{font-size:12px;color:var(--fg-dim);font-weight:500;margin-bottom:5px;display:block}
.field{margin-bottom:10px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Ring progress */
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring svg{transform:rotate(-90deg)}
.ring .ring-bg{fill:none;stroke:var(--bg-soft);stroke-width:6}
.ring .ring-fg{fill:none;stroke:var(--primary);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .ring-fg.accent{stroke:var(--accent)}
.ring .ring-fg.info{stroke:var(--info)}
.ring .ring-fg.warn{stroke:var(--warn)}
.ring-label{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-label .v{font-size:18px;font-weight:800;line-height:1}
.ring-label .t{font-size:9px;color:var(--fg-mute);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

/* Otter water animation */
.otter-stage{position:relative;height:140px;background:linear-gradient(180deg,#1a2a3a 0%,#0f1a25 100%);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.otter-stage .water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(77,171,255,.4),rgba(77,171,255,.7));transition:height .8s cubic-bezier(.4,0,.2,1)}
.otter-stage .water::before{content:'';position:absolute;top:-4px;left:0;right:0;height:8px;background:rgba(77,171,255,.3);border-radius:50% 50% 0 0;animation:wave 3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}
.otter{position:absolute;left:50%;bottom:0;transform:translateX(-50%);transition:bottom .8s cubic-bezier(.4,0,.2,1);z-index:2}
.otter-body{width:70px;height:38px;background:#5a4a3a;border-radius:50% 50% 40% 40%;position:relative;box-shadow:inset -3px -3px 8px rgba(0,0,0,.3)}
.otter-head{position:absolute;top:-16px;left:8px;width:32px;height:30px;background:#6a5a4a;border-radius:50%}
.otter-head::before{content:'';position:absolute;top:8px;left:6px;width:5px;height:5px;background:#000;border-radius:50%}
.otter-head::after{content:'';position:absolute;top:8px;right:6px;width:5px;height:5px;background:#000;border-radius:50%}
.otter-nose{position:absolute;top:15px;left:50%;transform:translateX(-50%);width:7px;height:5px;background:#2a1a0a;border-radius:50%}
.otter-ear{position:absolute;top:-4px;left:6px;width:10px;height:12px;background:#5a4a3a;border-radius:50%}
.otter-ear.r{left:auto;right:6px}
.otter-tail{position:absolute;top:8px;right:-12px;width:18px;height:14px;background:#5a4a3a;border-radius:50% 40% 40% 50%;transform:rotate(20deg);animation:tail 2s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-10deg)}}
.otter-stage .pct{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;z-index:3;color:var(--info)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;overflow:hidden}
.cal .dow{text-align:center;font-size:10px;color:var(--fg-mute);padding:6px 0;font-weight:600}
.cal .day{aspect-ratio:1/1;border-radius:8px;background:var(--bg-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:600;border:1px solid transparent;transition:.15s;position:relative;gap:1px;min-width:0}
.cal .day:hover{border-color:var(--border)}
.cal .day.today{border-color:var(--primary)}
.cal .day.has-workout{background:var(--primary-soft);color:var(--primary)}
.cal .day.rest{background:var(--bg-soft);color:var(--fg-mute)}
.cal .day.period{background:var(--accent-soft);color:var(--accent)}
.cal .day .dot{width:4px;height:4px;border-radius:50%;background:var(--primary)}
.cal .day .dot.accent{background:var(--accent)}
.cal .day.empty{background:transparent;cursor:default}

/* Habit chip grid fix */
.habit-grid{align-items:start}
.habit-grid > *{align-self:start}
.habit-grid svg{width:20px;height:20px}

/* Exercise entry */
.ex-block{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.ex-name{font-weight:700;font-size:14px;flex:1}
.ex-name small{display:block;font-size:11px;color:var(--fg-mute);font-weight:500;margin-top:1px}
.set-row{display:grid;grid-template-columns:24px 1fr 1fr 50px 36px 30px;gap:6px;align-items:center;margin-bottom:6px}
.set-row .set-no{font-size:11px;color:var(--fg-mute);font-weight:700;text-align:center}
.set-row input{padding:6px 8px;font-size:12px}
.set-row .icon-btn{width:28px;height:28px}
.set-row .icon-btn svg{width:14px;height:14px}

/* Rest timer ring */
.rest-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.rest-overlay.active{display:flex}
.rest-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px;text-align:center;max-width:340px;width:100%}
.rest-ring{width:200px;height:200px;margin:0 auto 20px;position:relative}
.rest-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rest-ring .ring-bg{stroke:var(--bg-soft)}
.rest-ring .ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rest-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rest-time .n{font-size:48px;font-weight:800;letter-spacing:-2px;line-height:1}
.rest-time .l{font-size:11px;color:var(--fg-mute);text-transform:uppercase;margin-top:4px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:90;padding:0}
.modal-bg.active{display:flex}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:18px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:17px;font-weight:700}

/* Bar chart */
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding:8px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar{width:100%;max-width:30px;background:linear-gradient(180deg,var(--primary),var(--primary-dim));border-radius:4px 4px 0 0;min-height:2px;transition:.3s;position:relative}
.bar.accent{background:linear-gradient(180deg,var(--accent),var(--accent-dim))}
.bar.info{background:linear-gradient(180deg,var(--info),#2a7ad6)}
.bar-label{font-size:10px;color:var(--fg-mute);font-weight:600}
.bar-val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;white-space:nowrap}

/* Line chart */
.line-chart{position:relative;height:120px;background:var(--bg-soft);border-radius:var(--radius-sm);padding:8px;overflow:hidden}
.line-chart svg{width:100%;height:100%}

/* Heatmap */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:280px}
.heat-cell{aspect-ratio:1;border-radius:3px;background:var(--bg-soft)}
.heat-cell.l1{background:rgba(0,255,136,.2)}
.heat-cell.l2{background:rgba(0,255,136,.4)}
.heat-cell.l3{background:rgba(0,255,136,.7)}
.heat-cell.l4{background:var(--primary)}

/* Toggle */
.toggle{position:relative;width:42px;height:24px;background:var(--bg-soft);border-radius:99px;cursor:pointer;border:1px solid var(--border);transition:.2s;flex-shrink:0;overflow:hidden}
.toggle.on{background:var(--primary);border-color:var(--primary)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on::after{transform:translateX(18px)}

/* Progress bar */
.progress{height:6px;background:var(--bg-soft);border-radius:3px;overflow:hidden}
.progress>div{height:100%;background:var(--primary);border-radius:3px;transition:.3s}
.progress>div.accent{background:var(--accent)}
.progress>div.info{background:var(--info)}

/* Onboarding */
.onboard{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;padding:30px 24px}
.onboard.active{display:flex}
.onboard-inner{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:380px;margin:0 auto}
.onboard-logo{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.onboard-logo svg{width:48px;height:48px;color:#000}
.onboard h1{font-size:28px;font-weight:800;margin-bottom:8px;letter-spacing:-.5px}
.onboard p{color:var(--fg-dim);font-size:14px;margin-bottom:30px;line-height:1.6}
.onboard-steps{display:flex;gap:6px;margin-bottom:30px}
.onboard-step{width:8px;height:8px;border-radius:50%;background:var(--bg-soft)}
.onboard-step.active{background:var(--primary);width:24px;border-radius:4px}
.onboard-features{display:grid;gap:14px;width:100%;margin-bottom:30px}
.onboard-feat{display:flex;align-items:center;gap:14px;text-align:left;background:var(--bg-card);padding:14px;border-radius:var(--radius);border:1px solid var(--border)}
.onboard-feat .ico{width:40px;height:40px;border-radius:10px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.onboard-feat .ico svg{width:20px;height:20px;color:var(--primary)}
.onboard-feat h4{font-size:14px;font-weight:700;margin-bottom:2px}
.onboard-feat p{font-size:12px;color:var(--fg-mute);margin:0}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg-elev);border:1px solid var(--border);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:300;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--fg-mute)}
.empty svg{width:48px;height:48px;margin-bottom:10px;opacity:.5}
.empty p{font-size:13px}

/* Responsive */
@media (max-width:768px){
  .sidebar{display:none}
  .tabbar{display:block}
  .content{padding:14px 12px 88px}
  .header h1{font-size:20px}
  .grid-3,.grid-4{grid-template-columns:1fr 1fr}
  .set-row{grid-template-columns:18px 1fr 1fr 44px 28px 26px;font-size:11px}
  .habit-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:380px){
  .cal .day{font-size:11px;border-radius:6px}
  .cal{gap:2px}
  .habit-grid{gap:6px}
  .habit-grid svg{width:18px;height:18px}
  .card.dense{padding:8px}
  .card.dense > div{font-size:12px}
}
@media (min-width:769px){
  .tabbar{display:none}
  .content{padding:24px 24px 40px}
  .habit-grid{grid-template-columns:1fr 1fr 1fr 1fr}
}

/* Period badge */
.period-tip{background:linear-gradient(135deg,rgba(255,107,53,.15),rgba(255,107,53,.05));border:1px solid var(--accent-soft);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.period-tip .ico{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.period-tip .ico svg{width:16px;height:16px;color:var(--accent)}
.period-tip .t{font-size:13px;font-weight:600}
.period-tip .s{font-size:11px;color:var(--fg-dim)}

/* Quick add buttons */
.quick-add{display:flex;gap:6px;flex-wrap:wrap}
.quick-chip{padding:7px 12px;background:var(--bg-soft);border:1px solid var(--border);border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.quick-chip:hover{background:var(--bg-elev);border-color:var(--primary);color:var(--primary)}

/* Food list */
.food-list{max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
.food-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border-soft);cursor:pointer}
.food-item:last-child{border-bottom:none}
.food-item:hover{background:var(--bg-soft)}
.food-item .n{font-weight:600;font-size:13px}
.food-item .n small{display:block;font-size:11px;color:var(--fg-mute);font-weight:500;margin-top:1px}

/* History list */
.hist-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--bg-card)}
.hist-item .ico{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hist-item .ico svg{width:18px;height:18px;color:var(--primary)}
.hist-item .ico.rest{background:var(--bg-soft)}
.hist-item .ico.rest svg{color:var(--fg-mute)}
.hist-item .info{flex:1;min-width:0}
.hist-item .info .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item .info .m{font-size:11px;color:var(--fg-mute);margin-top:1px}

/* Timeline */
.timeline{position:relative;padding-left:18px}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:10px}
.tl-item::before{content:'';position:absolute;left:-17px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--bg)}
.tl-item .t{font-size:11px;color:var(--fg-mute)}
.tl-item .v{font-size:13px;font-weight:600}

/* Exercise animation demo */
.demo-box{height:60px;background:var(--bg-soft);border-radius:var(--radius-sm);position:relative;overflow:hidden;margin:8px 0}
.demo-stick{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:3px;height:46px;background:var(--primary);transform-origin:bottom center;animation:demoSwing 1.6s ease-in-out infinite}
.demo-stick::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:var(--primary)}
@keyframes demoSwing{0%,100%{transform:translateX(-50%) rotate(-30deg)}50%{transform:translateX(-50%) rotate(30deg)}}

input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--bg-soft);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--primary);border-radius:50%;cursor:pointer}
.hr{height:1px;background:var(--border);margin:14px 0}
.kv{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.kv .k{color:var(--fg-dim)}
.kv .v{font-weight:600}
.mini-chart{display:flex;align-items:flex-end;gap:2px;height:40px}
.mini-chart .b{flex:1;background:var(--primary);border-radius:2px 2px 0 0;min-height:2px;opacity:.7}
</style>

function dow(d){return new Date(d).getDay()}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function diffDays(a,b){const MS=86400000;const x=new Date(a),y=new Date(b);return Math.round((Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())-Date.UTC(y.getFullYear(),y.getMonth(),y.getDate()))/MS)}

function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw){ DB = defaultData(); seedSample(); saveDB(); return; }
    DB = JSON.parse(raw);
    // Merge defaults for new fields
    const def = defaultData();
    DB.settings = Object.assign({},def.settings,DB.settings||{});
    DB.plans = DB.plans || def.plans;
    // Backfill lastScheduledDate for legacy plan entries (carryover support)
    const t=today(); const w=dow(t);
    ['A','B'].forEach(c=>{
      if(!DB.plans[c]) DB.plans[c]=def.plans[c];
      DB.plans[c] = DB.plans[c].map((p,i)=>{
        const dp = def.plans[c][i]||p;
        return {...dp, ...p,
          lastScheduledDate: p.lastScheduledDate || addDays(t,-((w-(p.day??dp.day)+7)%7)),
          completed: !!p.completed };
      });
    });
    if(!DB.plans.currentCycle) DB.plans.currentCycle = 'A';
    DB.foods = DB.foods && DB.foods.length ? DB.foods : def.foods;
    DB.exerciseLibrary = DB.exerciseLibrary && DB.exerciseLibrary.length ? DB.exerciseLibrary : def.exerciseLibrary;
    ['workouts','body','prs','meals','water','habits','period'].forEach(k=>{ if(!DB[k]) DB[k]=def[k] });
    // 功能二/五：向后兼容顶层字段
    DB.prs1RM = DB.prs1RM || {};
    DB.cardio = DB.cardio || [];
    // 功能六：自定义训练模板
    DB.templates = DB.templates || [];
    // 功能三：habits 中 sleepEarly 为 true 但无 sleepDuration → 用 goal 填充默认值
    if(DB.habits && DB.habits.forEach){
      DB.habits.forEach(h => {
        if(h && h.sleepEarly === true && !h.sleepDuration){
          h.sleepDuration = (DB.settings && DB.settings.sleepGoal) || 7.5;
        }
      });
    }
  }catch(e){
    DB = defaultData();
    toast('数据加载失败，已重置');
  }
}

function saveDB(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
  }catch(e){
    if(e.name==='QuotaExceededError' || e.code===22){
      toast('存储空间已满，请导出数据后清理');
    }else{
      toast('保存失败：'+e.message);
    }
  }
}

function seedSample(){
  // Sample data for first run
  const t = today();
  // Body entries
  for(let i=20;i>=0;i--){
    DB.body.push({date:addDays(t,-i),weight:(68+Math.sin(i/3)*0.8).toFixed(1),bodyFat:(15+Math.cos(i/4)*1.5).toFixed(1),waist:78,hip:94,thigh:54,arm:33});
  }
  // Workouts last 14 days
  for(let i=13;i>=0;i--){
    const d = addDays(t,-i);
    const wd = dow(d);
    if([1,3,5,0].includes(wd)){
      const plan = (i%8<4)?PLAN_A:PLAN_B;
      const p = plan.find(p=>p.day===wd);
      if(p){
        DB.workouts.push(makeSampleWorkout(d,p));
      }
    }
  }
  // Meals today
  ['早餐','午餐','晚餐'].forEach((meal,i)=>{
    DB.meals.push({id:uid(),date:t,meal,food:i===0?'燕麦50g':i===1?'鸡胸肉100g':'三文鱼100g',amount:1,cal:i===0?190:i===1?165:208,protein:i===0?7:i===1?31:20,carb:i===0?33:i===1?0:0,fat:i===0?3.5:i===1?3.6:13});
  });
  // Water today
  for(let i=0;i<4;i++){
    DB.water.push({id:uid(),date:t,time:['08:00','11:00','14:00','17:00'][i],amount:500});
  }
  // Habits today
  DB.habits.push({date:t,sleepEarly:true,sleepStart:'23:15',sleepEnd:'07:10',sleepDuration:7.9,stretch:false,meditate:true,drinkMore:true});
  // Period
  DB.period.push({id:uid(),start:addDays(t,-25),end:addDays(t,-19),flow:'normal',symptoms:'轻微腹痛'});
}

function makeSampleWorkout(date,plan){
  const exs = EXERCISES[plan.type]||EXERCISES.mixed;
  const exercises = exs.slice(0,5).map((e,idx)=>{
    const sets=[];
    const nsets = 4;
    for(let s=0;s<nsets;s++){
      sets.push({weight:20+s*2.5,reps:10-s,rpe:7+s*0.5,failure:s===nsets-1,note:''});
    }
    return {id:uid(),name:e.n,muscle:e.m,sets,supersetId:e.sup?`ss${idx}`:null,notes:''};
  });
  return {
    id:uid(),date,cycle:DB.plans.currentCycle,dayName:plan.name,type:plan.type,
    warmups:WARMUPS.map(w=>({name:w,done:true,duration:60})),
    exercises,

    bodyFeel:7,kneeStatus:'良好'
  };
}

function getLastWorkoutForExercise(exerciseName, beforeDate){
  if(!DB || !DB.workouts || !beforeDate) return null;
  const candidates = DB.workouts
    .filter(w => w.date < beforeDate && w.type !== 'rest')
    .sort((a,b) => a.date < b.date ? 1 : -1);
  for(const w of candidates){
    const ex = (w.exercises||[]).find(e => e.name === exerciseName);
    if(ex && ex.sets && ex.sets.length) return {date: w.date, sets: ex.sets};
  }
  return null;
}

function suggestOverload(lastSets, currentSets){
  if(!lastSets || !lastSets.length) return null;
  const allCompleted = lastSets.every(s => s.weight && s.reps);
  const avgRPE = lastSets.reduce((a,s)=>a+(parseFloat(s.rpe)||0),0)/lastSets.length;
  const maxWeight = Math.max(...lastSets.map(s=>parseFloat(s.weight)||0));
  if(maxWeight<=0) return null;
  if(allCompleted && avgRPE <= 8 && avgRPE > 0){
    return {type:'increase', amount: 2.5, targetWeight: Math.round((maxWeight + 2.5)*100)/100, reason:'上次完成度好，RPE≤8'};
  }else if(avgRPE >= 9.5){
    return {type:'maintain', amount:0, targetWeight: maxWeight, reason:'上次接近力竭，保持重量'};
  }else{
    return {type:'increase', amount: 1.25, targetWeight: Math.round((maxWeight + 1.25)*100)/100, reason:'尝试小幅增重'};
  }
}
window.suggestOverload = suggestOverload;

// 功能二：1RM 估算（Epley）
function estimate1RM(weight, reps){
  if(!weight || !reps) return 0;
  const w = parseFloat(weight);
  const r = parseInt(reps);
  if(!w || !r || r <= 0) return 0;
  if(r === 1) return Math.round(w);
  return Math.round(w * (1 + r / 30));
}
window.estimate1RM = estimate1RM;

function update1RM(exerciseName, weight, reps){
  const e1rm = estimate1RM(weight, reps);
  if(!DB.prs1RM) DB.prs1RM = {};
  const current = DB.prs1RM[exerciseName] || 0;
  if(e1rm > current){
    DB.prs1RM[exerciseName] = e1rm;
    return e1rm;
  }
  return 0;
}
window.update1RM = update1RM;

// 功能四：移动平均
function movingAverage(data, windowSize){
  const ws = parseInt(windowSize) || 7;
  const result = [];
  if(!data || !data.length) return result;
  for(let i=0; i<data.length; i++){
    const start = Math.max(0, i - ws + 1);
    const slice = data.slice(start, i+1);
    const avg = slice.reduce((a,b)=>a+parseFloat(b.weight||0),0) / slice.length;
    result.push({date: data[i].date, avg: parseFloat(avg.toFixed(2))});
  }
  return result;
}
window.movingAverage = movingAverage;

function getTodayWorkoutWithCarryover(){
  // Carryover-aware schedule resolver: find first uncompleted workout whose lastScheduledDate <= today,
  // push it to today if missed, preserve A/B cycle order.
  const todayStr = today();
  const cycle = DB.plans.currentCycle;
  const planArr = DB.plans[cycle]||DB.plans.A;
  // Workout already logged today → show logged (ignore carryover)
  const w = DB.workouts.find(x=>x.date===todayStr);
  if(w) return {plan:null, workout:w, isLogged:true, isRest:false, isCarryover:false, originalDate:null};
  // Iterate in cycle order to find the next eligible (pending + due or overdue) workout
  for(let i=0;i<planArr.length;i++){
    const item = planArr[i];
    if(item.completed) continue;
    const due = item.lastScheduledDate;
    if(!due || due>todayStr) continue; // not yet due
    if(due<todayStr){
      // Missed workout: carry it forward to today, preserve cycle/order
      const original = due;
      item.lastScheduledDate = todayStr;
      saveDB();
      return {plan:item, workout:null, isLogged:false, isRest:false, isCarryover:true, originalDate:original};
    }
    // Normal scheduled today
    return {plan:item, workout:null, isLogged:false, isRest:false, isCarryover:false, originalDate:null};
  }
  // No pending workouts in this cycle: mark as rest day
  return {plan:null, workout:null, isLogged:false, isRest:true, isCarryover:false, originalDate:null};
}
// Keep backward compat alias (unused by core flow after this patch)
const getTodayWorkout = getTodayWorkoutWithCarryover;

// Period helpers
function getPeriodStatus(){
  if(!DB.period.length) return null;
  const sorted = [...DB.period].sort((a,b)=>a.start<b.start?1:-1);
  const last = sorted[0];
  const cycleLen = 28;
  const todayStr = today();
  const periodLen = last.end ? Math.round((new Date(last.end)-new Date(last.start))/86400000)+1 : 5;
  const todayDate = new Date(todayStr);
  const nextStart = addDays(last.start,cycleLen);
  const daysUntil = Math.round((new Date(nextStart)-todayDate)/86400000);
  const isInPeriod = todayStr>=last.start && todayStr<=(last.end||addDays(last.start,periodLen-1));
  return {last,nextStart,daysUntil,isInPeriod,cycleLen,periodLen};
}

function ringPct(cur,goal){

function ringStroke(pct,r=46){
  const c = 2*Math.PI*r;
  return {strokeDasharray:c, strokeDashoffset: c*(1-pct/100)};
}

function progressColor(pct){
  if(pct>=100) return 'var(--primary)';
  if(pct>=70) return 'var(--primary)';
  if(pct>=40) return 'var(--warn)';
  return 'var(--accent)';
}

function habitStreak(field){
  let streak=0;
  let d = today();
  for(let i=0;i<365;i++){
    const h = getHabitOn(d);
    if(h && h[field]) streak++;
    else { if(i>0) break; }
    d = addDays(d,-1);
  }
  return streak;
}

function ringSvg(label,pct,mainVal,subVal,color,r){
  const stroke = ringStroke(pct,r);
  return `<div class="ring" style="width:78px;height:78px">
    <svg width="78" height="78" viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="${r}" fill="none" stroke-width="6"/>
      <circle class="ring-fg ${color}" cx="50" cy="50" r="${r}" fill="none" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${stroke.strokeDasharray}" stroke-dashoffset="${stroke.strokeDashoffset}"/>
    </svg>
    <div class="ring-label">
      <div class="v">${mainVal}</div>
      <div class="t">${label}${pct>=100?'✓':''}</div>
    </div>
  </div>`;
}

function habitChip(field,name,done,iconName){
  const streak = habitStreak(field);
  return `<button class="card dense" style="cursor:pointer;text-align:center;background:${done?'var(--primary-soft)':'var(--bg-soft)'};border-color:${done?'var(--primary)':'var(--border)'}" onclick="toggleHabit('${field}')">
    <div style="margin-bottom:4px">${icon(iconName,done?'':'')}</div>
    <div style="font-weight:600;font-size:13px;color:${done?'var(--primary)':'var(--fg)'}">${name}</div>
    <div class="muted" style="font-size:10px;margin-top:2px">${streak>0?`${streak}天连胜`:'未打卡'}</div>
  </button>`;
}

function toggleHabit(field){
  let h = getHabitOn(today());
  if(!h){ h={date:today(),sleepEarly:false,stretch:false,meditate:false,drinkMore:false}; DB.habits.push(h); }
  h[field] = !h[field];
  saveDB();
  render();
}

function quickWater(amount){
  DB.water.push({id:uid(),date:today(),time:now(),amount});
  saveDB();
  render();
  toast(`已记录 ${amount}ml`);
}

function startRest(key,date){
  const r = REST_TYPES.find(x=>x.key===key);
  DB.workouts.push({
    id:uid(),date,cycle:DB.plans.currentCycle,dayName:r.name,type:'rest',
    warmups:[],exercises:[],stretches:[],
    duration:30,totalVolume:0,bodyFeel:6,kneeStatus:'良好',restType:key
  });
  saveDB();
  toast(`已记录：${r.name}`);
}

function startTodayWorkout(){

}

function viewWorkout(id){
  const w = DB.workouts.find(x=>x.id===id);
  if(!w) return;
  let html = `
    <div class="modal-head"><h2>${w.dayName} - ${fmtDate(w.date)}</h2>
      <button class="icon-btn" onclick="closeModal()">${icon('i-x')}</button></div>

    <div class="kv"><span class="k">膝盖状态</span><span class="v">${w.kneeStatus||'-'}</span></div>
    ${w.notes?`<div class="kv"><span class="k">备注</span><span class="v">${w.notes}</span></div>`:''}
  `;
  
  // 热身
  if(w.warmups && w.warmups.length){
    const wuDone = w.warmups.filter(x=>x.done).length;
    const wuTime = w.warmups.reduce((a,x)=>a+(x.duration||0),0);
    html += `<div class="section-title" style="margin-top:12px">热身 (${wuDone}/${w.warmups.length}) · 总时长 ${wuTime}s</div>`;
    html += `<div class="card dense">`;
    w.warmups.forEach(wu=>{
      html += `<div class="row between" style="padding:6px 0;font-size:13px;border-bottom:1px solid var(--border-soft)">
        <span style="color:${wu.done?'var(--primary)':'var(--fg-dim)'}">${wu.done?'✓':'○'} ${wu.name}</span>
        <span class="muted">${wu.duration||0}s</span>
      </div>`;
    });
    html += `</div>`;
  }
  
  // 正式训练
  if(w.exercises && w.exercises.length){
    html += `<div class="section-title" style="margin-top:12px">正式训练 · ${w.exercises.length}个动作</div>`;
    w.exercises.forEach(e=>{
      const vol = (e.sets||[]).reduce((a,s)=>a+(s.weight||0)*(s.reps||0),0);
      html += `<div class="ex-block" style="margin-top:10px">
        <div class="ex-head">
          <div class="ex-name">${e.name}<small>${e.muscle||''} ${e.supersetId?'· 超级组('+e.supersetId+')':''}</small></div>
          <span class="tag">${vol}kg</span>
        </div>
        ${(e.sets||[]).map((s,i)=>`<div class="kv"><span class="k">第${i+1}组</span><span class="v">${s.weight||0}kg × ${s.reps||0}次 RPE${s.rpe||'-'}${s.failure?' 力竭':''}</span></div>`).join('')}
      </div>`;
    });
  }
  
  // 拉伸
  if(w.stretches && w.stretches.length){
    const stDone = w.stretches.filter(x=>x.done).length;
    const stTime = w.stretches.reduce((a,x)=>a+(x.duration||0),0);
    html += `<div class="section-title" style="margin-top:12px">拉伸 (${stDone}/${w.stretches.length}) · 总时长 ${stTime}s</div>`;
    html += `<div class="card dense">`;
    w.stretches.forEach(st=>{
      html += `<div class="row between" style="padding:6px 0;font-size:13px;border-bottom:1px solid var(--border-soft)">

        <span class="muted">${st.duration||0}s</span>
      </div>`;
    });
    html += `</div>`;
  }
  
  html += `<div class="row" style="gap:8px;margin-top:14px">
    <button class="btn ghost block" onclick="closeModal()">关闭</button>
    <button class="btn primary block" onclick="closeModal();editWorkout('${w.id}')">${icon('i-edit')}编辑此记录</button>
  </div>`;
  
  const modal = document.getElementById('modal');
  modal.innerHTML = html;
  document.getElementById('modalBg').classList.add('active');
}

/* ============ TRAIN PAGE ============ */
function renderTrain(){
  const m = state.calMonth;
  const y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y,mo,1);
  const startDow = first.getDay();
  const days = new Date(y,mo+1,0).getDate();
  let cells = '';
  ['日','一','二','三','四','五','六'].forEach(d=> cells += `<div class="dow">${d}</div>`);
  for(let i=0;i<startDow;i++) cells += `<div class="day empty"></div>`;
  for(let d=1;d<=days;d++){
    const ds = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds===today();
    const hasW = DB.workouts.some(w=>w.date===ds);
    const isPeriod = DB.period.some(p=>ds>=p.start && ds<=(p.end||addDays(p.start,4)));
    const wd = new Date(y,mo,d).getDay();
    const isRest = ![1,3,5,0].includes(wd);
    let cls = 'day';
    if(isToday) cls += ' today';
    if(hasW) cls += ' has-workout';
    else if(isRest) cls += ' rest';
    if(isPeriod) cls += ' period';
    const dot = isPeriod?'<div class="dot accent"></div>':(hasW?'<div class="dot"></div>':'');
    cells += `<div class="${cls}" onclick="selectDate('${ds}')">${d}${dot}</div>`;
  }
  const selected = state.selectedDate;
  const selW = DB.workouts.find(w=>w.date===selected);
  const selPlan = (()=>{
    const wd = dow(selected);
    if(![1,3,5,0].includes(wd)) return null;
    const arr = DB.plans[DB.plans.currentCycle]||DB.plans.A;
    return arr.find(p=>p.day===wd);
  })();

  const prevM = new Date(y, mo-1, 1);
  const nextM = new Date(y, mo+1, 1);
  const prevLabel = `${prevM.getMonth()+1}月`;
  const nextLabel = `${nextM.getMonth()+1}月`;

  // 动作库入口
  let html = `<div class="row" style="gap:8px;margin-bottom:12px">
    <button class="btn primary" onclick="navigate('library')">${icon('i-dumbbell')}动作库</button>
    <button class="btn ghost" onclick="showPlanDetail()">${icon('i-list')}AB方案</button>
  </div>`;
  html += `<div class="header"><div><h1>训练<span class="sub">${y}年${mo+1}月</span></h1></div>
    <div class="row" style="gap:6px">
      <button class="btn ghost sm" onclick="calMove(-1)">${icon('i-chev-l')} ${prevLabel}</button>
      <button class="btn ghost sm" onclick="calMove(1)">${nextLabel} ${icon('i-chev-r')}</button>
    </div></div>`;

  html += `<div class="card"><div class="cal">${cells}</div></div>`;

  // 功能五：快速记录有氧入口
  html += `<div class="section-title">有氧训练</div>`;
  html += `<div class="card"><div class="row" style="gap:8px;flex-wrap:wrap">`;
  CARDIO_TYPES.forEach(c => {
    html += `<button class="btn ghost sm" onclick="openCardioModal('${c.key}')">${icon(c.icon)}${c.name}</button>`;
  });
  html += `</div></div>`;

  // Selected day
  html += `<div class="section-title">${fmtDate(selected)} ${'日一二三四五六'[dow(selected)]}</div>`;
  if(selW){
    html += renderWorkoutSummary(selW);
  }else if(selPlan){
    html += `<div class="card">
      <div class="row between" style="margin-bottom:8px">
        <h3 style="margin:0">${icon('i-dumbbell')}${selPlan.name}</h3>
        <span class="tag accent">${DB.plans.currentCycle}循环</span>
      </div>
      <p class="muted" style="margin-bottom:10px;font-size:13px">尚未记录训练，开始今天的三段式训练</p>
      <button class="btn block primary" onclick="startWorkoutForToday()">${icon('i-play')}开始训练</button>
    </div>`;
  }else{
    html += `<div class="card">
      <h3 style="margin:0 0 8px">${icon('i-bed')}休息日</h3>
      <p class="muted" style="margin-bottom:10px;font-size:13px">主动恢复，让身体修复</p>
      <div class="grid grid-2">
      ${REST_TYPES.map(r=>`<button class="btn ghost" onclick="startRest('${r.key}','${selected}')">${icon(r.icon)}${r.name}</button>`).join('')}
      </div>
    </div>`;
  }

  // 功能六：或选择自定义模板（始终显示入口，休息日/计划日都可用）
  html += `<div class="section-title">或选择自定义模板</div>`;
  html += `<div class="card"><div class="row" style="gap:8px;flex-wrap:wrap">`;
  const tmpls = DB.templates || [];
  if(tmpls.length){
    tmpls.forEach(t => {
      html += `<button class="btn ghost sm" onclick="startTemplateWorkout('${t.id}')">${icon('i-play')}${t.name}</button>`;
    });
  }else{
    html += `<span class="muted" style="font-size:12px">暂无模板，去「动作库」创建</span>`;
  }
  html += `<button class="btn primary sm" onclick="navigate('templates')">${icon('i-list')}管理模板</button>`;
  html += `</div></div>`;

  return html;
}

function calMove(n){
  const m = new Date(state.calMonth);
  m.setMonth(m.getMonth()+n);
  state.calMonth = m;
  render();
}

function selectDate(d){
  state.selectedDate = d;
  state.calMonth = new Date(d);
  render();
}

function renderWorkoutSummary(w){
  let html = `<div class="card">
    <div class="row between" style="margin-bottom:10px">
      <h3 style="margin:0">${icon('i-check')}${w.dayName||'训练'}</h3>
      <span class="tag primary">${w.duration||0}min</span>
    </div>
    <div class="grid grid-3" style="margin-bottom:10px">
      <div class="kv"><span class="k">动作</span><span class="v">${(w.exercises||[]).length}</span></div>
      <div class="kv"><span class="k">容量</span><span class="v">${w.totalVolume||0}kg</span></div>
      <div class="kv"><span class="k">体感</span><span class="v">${w.bodyFeel||'-'}/10</span></div>
    </div>`;
  
  // 热身
  if(w.warmups && w.warmups.length){
    const wuDone = w.warmups.filter(x=>x.done).length;
    const wuTime = w.warmups.reduce((a,x)=>a+(x.duration||0),0);
    html += `<div class="section-title" style="margin-top:6px">热身 (${wuDone}/${w.warmups.length}) · 总时长 ${wuTime}s</div>`;
    html += `<div class="card dense">`;
    w.warmups.forEach(wu=>{
      html += `<div class="row between" style="padding:5px 0;font-size:12px;border-bottom:1px solid var(--border-soft)">
        <span style="color:${wu.done?'var(--primary)':'var(--fg-dim)'}">${wu.done?'✓':'○'} ${wu.name}</span>
        <span class="muted">${wu.duration||0}s</span>
      </div>`;
    });
    html += `</div>`;
  }
  
  if(w.exercises && w.exercises.length){
    html += `<div class="section-title" style="margin-top:6px">正式训练 · ${w.exercises.length}动作</div>`;
    w.exercises.forEach(e=>{
      const vol = (e.sets||[]).reduce((a,s)=>a+(s.weight||0)*(s.reps||0),0);
      html += `<div class="ex-block">
        <div class="ex-head">
          <div class="ex-name">${e.name}<small>${e.muscle||''} ${e.supersetId?'· 超级组'+e.supersetId:''}</small></div>
          <span class="tag">${vol}kg</span>
        </div>
        ${(e.sets||[]).map((s,i)=>`<div class="kv"><span class="k">第${i+1}组</span><span class="v">${s.weight||0}kg × ${s.reps||0}次 RPE${s.rpe||'-'}</span></div>`).join('')}
      </div>`;
    });
  }
  
  // 拉伸
  if(w.stretches && w.stretches.length){
    const stDone = w.stretches.filter(x=>x.done).length;
    const stTime = w.stretches.reduce((a,x)=>a+(x.duration||0),0);
    html += `<div class="section-title" style="margin-top:6px">拉伸 (${stDone}/${w.stretches.length}) · 总时长 ${stTime}s</div>`;
    html += `<div class="card dense">`;
    w.stretches.forEach(st=>{
      html += `<div class="row between" style="padding:5px 0;font-size:12px;border-bottom:1px solid var(--border-soft)">
        <span style="color:${st.done?'var(--primary)':'var(--fg-dim)'}">${st.done?'✓':'○'} ${st.name}</span>
        <span class="muted">${st.duration||0}s</span>
      </div>`;
    });
    html += `</div>`;
  }
  
  html += `<div class="row" style="gap:8px;margin-top:10px">
    <button class="btn ghost sm" onclick="viewWorkout('${w.id}')">${icon('i-eye')}详情</button>
    <button class="btn ghost sm" onclick="editWorkout('${w.id}')">${icon('i-edit')}编辑</button>
    <button class="btn ghost sm" onclick="deleteWorkout('${w.id}')">${icon('i-trash')}删除</button>
  </div></div>`;
  return html;
}

function deleteWorkout(id){
  if(!confirm('确认删除这条训练记录？')) return;
  DB.workouts = DB.workouts.filter(w=>w.id!==id);
  saveDB();
  render();
  toast('已删除');
}

function editWorkout(id){
  const w = DB.workouts.find(x=>x.id===id);
  if(!w) return;
  // 重建 activeWorkout 进入编辑模式
  activeWorkout = {
    date: w.date,
    plan: {name: w.dayName, type: w.type},
    warmups: (w.warmups||[]).length ? w.warmups : WARMUPS.map(name=>({name,done:false,duration:0})),
    exercises: (w.exercises||[]).map(e=>({
      id: e.id || uid(),
      name: e.name,
      muscle: e.muscle,
      supersetId: e.supersetId,
      sets: e.sets.map(s=>({weight:s.weight||'',reps:s.reps||'',rpe:s.rpe||'',failure:!!s.failure,note:s.note||''})),
      notes: e.notes||''
    })),
    stretches: (w.stretches||[]).length ? w.stretches : STRETCHES.map(name=>({name,done:false,duration:0})),
    startTime: Date.now() - (w.duration||0)*60000,
    phase: 'warmup',
    editingId: id
  };
  renderActiveWorkout();
  toast('已进入编辑模式，修改后点击底部「完成训练」保存');
}

/* Start today's workout with 3-phase flow */
let activeWorkout = null;
function startWorkoutForToday(){
  const todayStr = state.selectedDate;
  if(DB.workouts.some(w=>w.date===todayStr)){
    toast('该日期已有训练记录');
    return;
  }
  let p = null;
  const arr = DB.plans[DB.plans.currentCycle]||DB.plans.A;
  if(todayStr===today()){
    // Use carryover-aware plan for today
    const tw = getTodayWorkoutWithCarryover();
    p = tw.plan;
    if(!p && !tw.isRest){ toast('今日训练状态异常，请重试'); return; }
    if(tw.isRest){ toast('今天是休息日'); return; }
  }else{
    // For arbitrary calendar dates: use day-of-week fixed schedule
    const wd = dow(todayStr);
    p = arr.find(x=>x.day===wd);
  }
  if(!p){ toast('今天是休息日'); return; }
  const exs = EXERCISES[p.type]||EXERCISES.mixed;
  activeWorkout = {
    date: todayStr, plan: p,
    warmups: WARMUPS.map(w=>({name:w,done:false,duration:0})),
    exercises: exs.map((e,i)=>({
      id:uid(), name:e.n, muscle:e.m, supersetId:e.sup?`ss${i}`:null,
      sets:[{weight:'',reps:'',rpe:'',failure:false,note:''}], notes:''
    })),
    stretches: STRETCHES.map(s=>({name:s,done:false,duration:0})),
    startTime: Date.now(), phase: 'warmup'
  };
  renderActiveWorkout();
}

function renderActiveWorkout(){
  if(!activeWorkout) { render(); return; }
  const aw = activeWorkout;
  const c = document.getElementById('content');
  const wDone = aw.warmups.filter(w=>w.done).length;
  const sDone = aw.stretches.filter(s=>s.done).length;
  const exDone = aw.exercises.filter(e=>e.sets.every(s=>s.weight)).length;
  c.innerHTML = `
    <div class="header">
      <div><h1>${aw.plan.name}<span class="sub">${fmtDate(aw.date)} · ${DB.plans.currentCycle}循环</span></h1></div>
      <button class="btn ghost sm" onclick="cancelWorkout()">${icon('i-x')}取消</button>
    </div>
    <div class="card" style="background:var(--bg-elev)">
      <div class="row between">
        <div><div class="muted" style="font-size:11px">热身</div><div class="big primary">${wDone}/${aw.warmups.length}</div></div>
        <div><div class="muted" style="font-size:11px">动作</div><div class="big">${exDone}/${aw.exercises.length}</div></div>
        <div><div class="muted" style="font-size:11px">拉伸</div><div class="big accent">${sDone}/${aw.stretches.length}</div></div>
        <div><div class="muted" style="font-size:11px">计时</div><div class="big" id="wkTimer">00:00</div></div>
      </div>
    </div>
    <div class="section-title">① 热身（${wDone}/${aw.warmups.length}）</div>
    ${aw.warmups.map((w,i)=>warmupRow(w,i)).join('')}
    <div class="section-title">② 正式训练</div>
    ${aw.exercises.map((e,i)=>exerciseRow(e,i)).join('')}
    <div class="section-title">③ 拉伸（${sDone}/${aw.stretches.length}）</div>
    ${aw.stretches.map((s,i)=>stretchRow(s,i)).join('')}
    <div class="section-title">完成记录</div>
    <div class="card">
      <div class="field-row">
        <div class="field"><label class="label">训练时长(分)</label><input type="number" id="wkDuration" value="${Math.max(30,Math.round((Date.now()-aw.startTime)/60000))}"></div>
        <div class="field"><label class="label">体感(1-10)</label><input type="number" id="wkFeel" min="1" max="10" value="7"></div>
      </div>
      <div class="field-row">
        <div class="field"><label class="label">膝盖状态</label>
          <select id="wkKnee"><option>良好</option><option>轻微不适</option><option>明显不适</option><option>疼痛</option></select>
        </div>
        <div class="field"><label class="label">备注</label><input id="wkNote" placeholder="备注"></div>
      </div>
      <button class="btn block primary lg" onclick="finishWorkout()">${icon('i-check')}完成训练</button>
    </div>
  `;
  startWorkoutTimer();
}

function warmupRow(w,i){
  return `<div class="card dense row between" style="background:${w.done?'var(--primary-soft)':'var(--bg-card)'};border-color:${w.done?'var(--primary)':'var(--border)'}">
    <div class="row" style="gap:10px">
      <button class="btn ${w.done?'primary':'ghost'} sm" style="padding:4px 8px;min-width:68px" onclick="toggleWarmup(${i})">${w.done?icon('i-check')+' 已完成':icon('i-timer')+' 未开始'}</button>
      <div>
        <div style="font-weight:600;font-size:13px">${w.name}</div>
        <div class="muted" style="font-size:11px">${w.duration?w.duration+'s':'点击开始计时'}</div>
      </div>
    </div>
    <button class="btn ghost sm" onclick="warmupTimer(${i})">${w.done?'完成':'计时'}</button>
  </div>`;
}

function toggleWarmup(i){
  const w = activeWorkout.warmups[i];
  w.done = !w.done;
  if(w.done && !w.duration) w.duration = 60;
  renderActiveWorkout();
}

let warmupTI = null;
function warmupTimer(i){
  const w = activeWorkout.warmups[i];
  if(w.done){ toggleWarmup(i); return; }
  let sec = 0;
  if(warmupTI) clearInterval(warmupTI);
  const modal = document.getElementById('modal');
  modal.innerHTML = `<div class="modal-head"><h2>${w.name}</h2><button class="icon-btn" onclick="stopWarmupTimer()">${icon('i-x')}</button></div>
    <div style="text-align:center;padding:20px">
      <div class="huge primary" id="wtDisplay" style="margin-bottom:16px">0s</div>
      <div class="row" style="gap:8px;justify-content:center">
        <button class="btn primary" onclick="finishWarmup(${i})">${icon('i-check')}完成</button>
        <button class="btn ghost" onclick="stopWarmupTimer()">取消</button>
      </div>

  const tips = [];

  if(surplus > 400) tips.push('或追加1组HIIT（15分钟）帮助消耗');
  if(surplus > 600) tips.push('严重超标：建议取消加餐，晚餐主食减半');
  if(nut.protein < DB.settings.proteinGoal * 0.5) tips.push('蛋白质严重不足，晚餐优先补充鸡胸肉/鱼/蛋');
  if(nut.carb > DB.settings.carbsGoal) tips.push('碳水已超标，停止摄入主食、甜食和含糖饮料');
  if(nut.fat > DB.settings.fatGoal) tips.push('脂肪超标，避免油炸、坚果和肥肉');
  return tips.join('；') || '适当增加有氧运动帮助消耗';
}

  if(nut.protein < s.proteinGoal * 0.8) tips.push(`优先补充蛋白质（还差 ${Math.round(s.proteinGoal - nut.protein)}g）`);

function finishWorkout(){
  if(!activeWorkout) return;
  const aw = activeWorkout;
  const duration = parseInt(document.getElementById('wkDuration').value)||0;
  const feel = parseInt(document.getElementById('wkFeel').value)||7;
  const knee = document.getElementById('wkKnee').value;
  const note = document.getElementById('wkNote').value;
  // Clean sets, calculate volume, update PRs
  const exercises = aw.exercises.map(e=>{
    const sets = e.sets.filter(s=>s.weight && s.reps).map(s=>({
      weight:parseFloat(s.weight)||0, reps:parseInt(s.reps)||0,
      rpe:s.rpe?parseFloat(s.rpe):null, failure:!!s.failure, note:s.note||''
    }));
    const vol = sets.reduce((a,s)=>a+s.weight*s.reps,0);
    const maxW = sets.reduce((a,s)=>Math.max(a,s.weight),0);
    if(maxW>0){
      const prev = DB.prs[e.name]||0;
      if(maxW>prev) DB.prs[e.name] = maxW;
      // 功能二：同时更新 1RM
      if(sets && sets.length){
        const bestSet = sets.reduce((a,s)=>{
          const e1a = estimate1RM(s.weight, s.reps);
          const e1b = estimate1RM(a.weight, a.reps);
          return (e1a > e1b) ? s : a;
        }, sets[0]);
        if(bestSet){
          const new1RM = update1RM(e.name, bestSet.weight, bestSet.reps);
          if(new1RM) setTimeout(()=>toast(`🎉 ${e.name} 1RM 刷新：${new1RM}kg`), 100);
        }
      }
    }
    return {id:e.id, name:e.name, muscle:e.muscle, supersetId:e.supersetId, sets, notes:e.notes||''};
  }).filter(e=>e.sets.length>0);
  const totalVolume = exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.weight*s.reps,0),0);

  const w = {
    id: aw.editingId || uid(), 
    date:aw.date, 
    cycle:DB.plans.currentCycle, 
    dayName:aw.plan.name, 
    type:aw.plan.type,
    warmups:aw.warmups, 
    exercises, 
    stretches:aw.stretches,
    duration, 
    totalVolume, 
    bodyFeel:feel, 
    kneeStatus:knee, 
    notes:note
  };
  
  if(aw.editingId){
    const idx = DB.workouts.findIndex(x=>x.id===aw.editingId);
    if(idx>=0) DB.workouts[idx] = w;
    toast('训练记录已更新');
  } else {
    // 功能六：自定义模板训练不触发 AB 循环推进，直接保存记录返回
    if(aw.plan && aw.plan.type === 'template'){
      DB.workouts.push(w);
      saveDB();
      activeWorkout = null;
      if(typeof workoutTI !== 'undefined' && workoutTI) clearInterval(workoutTI);
      render();
      toast('模板训练已记录');
      return;
    }
    DB.workouts.push(w);
    // Mark current item completed, advance next item
    const planArr = DB.plans[DB.plans.currentCycle];
    let idx = planArr.findIndex(x=>x===aw.plan);
    if(idx<0) idx = planArr.findIndex(x=>x.type===aw.plan.type && x.name===aw.plan.name);
    const cur = planArr[idx];
    if(cur){
      cur.completed = true;
      let nextIdx = idx+1;
      if(nextIdx<planArr.length){
        const nxt = planArr[nextIdx];
        const curDay = cur.day ?? 0;
        const nxtDay = nxt.day ?? 0;
        const gap = Math.max(1, ((nxtDay-curDay+7)%7) || 2);
        const todayStr = today();
        nxt.lastScheduledDate = addDays(todayStr, gap);
      }
    }
    if(planArr.every(x=>x.completed)){
      const oldCycle = DB.plans.currentCycle;
      const nextCycle = oldCycle==='A'?'B':'A';
      DB.plans.currentCycle = nextCycle;
      const newArr = DB.plans[nextCycle];
      const t=today(); const w=dow(t);
      newArr.forEach((item,i)=>{
        item.completed = false;
        const prev = i===0 ? newArr[newArr.length-1] : newArr[i-1];
        const prevDay = prev.day ?? 0;
        const thisDay = item.day ?? 0;
        if(i===0){
          const diff = ((thisDay-w+7)%7);
          item.lastScheduledDate = addDays(t, diff===0 ? 0 : diff);
        }else{
          const gap = Math.max(1, ((thisDay-prevDay+7)%7) || 2);
          item.lastScheduledDate = addDays(prev.lastScheduledDate, gap);
        }
      });
      toast(`${oldCycle}循环完成，已切换至${nextCycle}循环`);
    } else {
      toast('训练已记录');
    }
  }
  saveDB();
  activeWorkout = null;
  if(workoutTI) clearInterval(workoutTI);
  render();
}

let restTI = null, restTotal = 0, restLeft = 0, restPaused = false;
function restTimer(seconds){
  restTotal = seconds; restLeft = seconds; restPaused = false;
  document.getElementById('restOverlay').classList.add('active');
  updateRestRing();
  if(restTI) clearInterval(restTI);
  restTI = setInterval(()=>{
    if(restPaused) return;
    restLeft--;
    if(restLeft<=0){
      restStop();
      beep();
      toast('休息结束！');
    }else{
      updateRestRing();
      if(restLeft<=3) beep();
    }
  },1000);
}
function updateRestRing(){
  const r = 46, c = 2*Math.PI*r;
  const pct = restTotal>0 ? restLeft/restTotal : 0;
  const fg = document.getElementById('restRingFg');
  fg.setAttribute('stroke-dasharray', c);
  fg.setAttribute('stroke-dashoffset', c*(1-pct));
  document.getElementById('restTime').textContent = restLeft;
}
function restToggle(){
  restPaused = !restPaused;
  const btn = document.getElementById('restToggle');
  btn.innerHTML = restPaused?`${icon('i-play')}继续`:`${icon('i-pause')}暂停`;
}
function restAdd(n){
  restTotal = Math.max(10, restTotal+n);
  restLeft = Math.max(0, restLeft+n);
  updateRestRing();
}
function restStop(){
  if(restTI) clearInterval(restTI);
  document.getElementById('restOverlay').classList.remove('active');
}
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; o.type='sine';
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.15);
    o.start(); o.stop(ctx.currentTime+0.15);
  }catch(e){}
}

window.saveCardio = function(type){
  const d = _byId('cDate');
  const du = _byId('cDuration');
  const di = _byId('cDistance');
  const hr = _byId('cHR');
  const cc = _byId('cCal');
  const cn = _byId('cNote');
  if(!d || !du || !di) return;
  const date = d.value;
  const duration = parseFloat(du.value)||0;
  const distance = parseFloat(di.value)||0;
  const hrV = parseFloat(hr.value)||0;
  const cal = parseFloat(cc.value)||0;
  const note = cn ? (cn.value||'') : '';

  // 自动计算配速
  let pace = '';
  if(distance > 0 && duration > 0){
    const minPerUnit = duration / distance;
    const pMin = Math.floor(minPerUnit);
    const pSec = Math.round((minPerUnit - pMin)*60);
    pace = `${pMin}'${String(pSec).padStart(2,'0')}"`;
  }

  if(!DB.cardio) DB.cardio = [];
  DB.cardio.push({
    id: uid(),
    date: date,
    type: type || 'run',
    duration: duration,
    distance: distance,
    pace: pace,
    avgHeartRate: hrV,
    calories: cal,
    notes: note
  });
  saveDB();
  closeModal();
  render();
  toast('有氧记录已保存');
};

window.delCardio = function(id){
  if(!DB.cardio) return;
  DB.cardio = DB.cardio.filter(c=>c.id!==id);
  saveDB();
  render();
};

function parseFoodWeight(input){
  input = input.trim();
  // 匹配 "200g米饭" "200克米饭" "200 g 米饭"
  let m = input.match(/^(\d+(?:\.\d+)?)\s*[g克]\s*(.+)$/);
  if(m) return {weight: parseFloat(m[1]), name: m[2].trim()};
  // 匹配 "米饭200g" "米饭 200g" "米饭 200克"
  m = input.match(/^(.+?)\s*(\d+(?:\.\d+)?)\s*[g克]$/);
  if(m) return {weight: parseFloat(m[2]), name: m[1].trim()};
  return null;
}

function matchFoodLibrary(name){
  name = name.replace(/^\d+[g克]\s*/, '').trim();
  if(!name) return null;
  // 先精确匹配基础名
  for(const f of DB.foods){
    const baseName = f.n.replace(/(\d+(?:\.\d+)?)\s*(g|克|ml|毫升|个|根|片|勺|瓣|块|杯|碗|份|\([^)]+\))\s*$/, '').trim();
    if(baseName === name || f.n === name) return f;
  }
  // 再模糊匹配
  for(const f of DB.foods){
    const baseName = f.n.replace(/(\d+(?:\.\d+)?)\s*(g|克|ml|毫升|个|根|片|勺|瓣|块|杯|碗|份|\([^)]+\))\s*$/, '').trim();
    if(baseName.includes(name) || name.includes(baseName) || f.n.includes(name)) return f;
  }
  return null;
}

function calcFoodByWeight(food, weight){
  // 从食物名提取基准重量，如"米饭100g"->100，"鸡蛋1个"->1，"牛奶250ml"->250
  const m = food.n.match(/(\d+(?:\.\d+)?)\s*(g|克|ml|毫升)/);
  const baseWeight = m ? parseFloat(m[1]) : 100;
  const ratio = weight / baseWeight;
  return {
    cal: Math.round(food.c * ratio),
    protein: Math.round(food.p * ratio * 10) / 10,
    carb: Math.round(food.cb * ratio * 10) / 10,
    fat: Math.round(food.f * ratio * 10) / 10
  };
}

function addCustomMeal(){
  const meal = document.getElementById('mMeal').value;
  const date = document.getElementById('mDate').value;
  const nameInput = document.getElementById('mName').value.trim();
  
  // ===== 智能识别：200g米饭 =====
  const parsed = parseFoodWeight(nameInput);
  if(parsed){
    const matched = matchFoodLibrary(parsed.name);
    if(matched){
      const calc = calcFoodByWeight(matched, parsed.weight);
      DB.meals.push({
        id: uid(), date, meal,
        food: `${parsed.weight}g${parsed.name}`,
        amount: 1,
        cal: calc.cal,
        protein: calc.protein,
        carb: calc.carb,
        fat: calc.fat
      });
      // 如果不在库中，自动加入（方便下次）
      const exists = DB.foods.some(f => f.n === `${parsed.name}100g`);
      if(!exists && parsed.weight === 100){
        DB.foods.push({id: uid(), n: `${parsed.name}100g`, c: matched.c, p: matched.p, cb: matched.cb, f: matched.f});
      }
      saveDB();
      closeModal();
      render();
      toast(`已记录 ${parsed.weight}g${parsed.name} = ${calc.cal}千卡`);
      return;
    }
  }
  
  // ===== 原有手动逻辑（非常见食物） =====
  const name = nameInput || '未知食物';
  const cal = parseFloat(document.getElementById('mCal').value)||0;
  const pro = parseFloat(document.getElementById('mPro').value)||0;
  const cb = parseFloat(document.getElementById('mCb').value)||0;
  const fat = parseFloat(document.getElementById('mFat').value)||0;
  const amount = parseFloat(document.getElementById('mAmount').value)||1;
  if(!name){ toast('请输入食物名'); return; }
  DB.meals.push({id: uid(), date, meal, food: name, amount, cal: cal*amount, protein: pro*amount, carb: cb*amount, fat: fat*amount});
  // 保存到食物库
  if(name && cal){
    const exists = DB.foods.some(f => f.n === name);
    if(!exists){
      DB.foods.push({id: uid(), n: name, c: cal, p: pro, cb: cb, f: fat});
    }

function renderLogWater(){
  const todayStr = today();
  const todayW = DB.water.filter(w=>w.date===todayStr);
  const total = todayW.reduce((a,w)=>a+w.amount,0);
  const goal = DB.settings.waterGoal;
  const pct = ringPct(total,goal);
  // streak
  let streak=0;
  let d=todayStr;
  for(let i=0;i<365;i++){
    const w = DB.water.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0);
    if(w>=goal*0.8) streak++;
    else { if(i>0) break; }
    d=addDays(d,-1);
  }
  let html = `<div class="card" style="text-align:center">
    <div class="ring" style="width:140px;height:140px;margin:6px auto">
      <svg width="140" height="140" viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="46" fill="none" stroke-width="6"/>
        <circle class="ring-fg info" cx="50" cy="50" r="46" fill="none" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="${ringStroke(pct).strokeDasharray}" stroke-dashoffset="${ringStroke(pct).strokeDashoffset}"/>
      </svg>
      <div class="ring-label">
        <div class="huge" style="font-size:24px">${total}</div>
        <div class="t">/${goal}ml</div>
      </div>
    </div>
    <div class="row" style="gap:6px;justify-content:center;margin-top:8px">
      <button class="btn primary sm" onclick="quickWater2(250)">${icon('i-plus')}250</button>
      <button class="btn primary sm" onclick="quickWater2(500)">${icon('i-plus')}500</button>
      <button class="btn primary sm" onclick="quickWater2(750)">${icon('i-plus')}750</button>
    </div>
    <div style="margin-top:12px"><span class="tag primary">${streak}天连胜</span></div>
  </div>`;
  html += `<div class="section-title">今日时间轴</div>`;
  if(!todayW.length){
    html += `<div class="card"><div class="empty">${icon('i-drop')}<p>今天还没有喝水记录</p></div></div>`;
  }else{
    html += `<div class="card"><div class="timeline">`;
    todayW.sort((a,b)=>a.time<b.time?-1:1).forEach(w=>{
      html += `<div class="tl-item"><div class="t">${w.time}</div><div class="v">${w.amount}ml</div></div>`;
    });
    html += `</div></div>`;
  }
  // last 7 days
  html += `<div class="section-title">近7天</div><div class="card">`;
  const bars = [];
  for(let i=6;i>=0;i--){
    const d = addDays(today(),-i);
    const amt = DB.water.filter(w=>w.date===d).reduce((a,w)=>a+w.amount,0);
    bars.push({d:parseInt(d.slice(8)),amt,pct:ringPct(amt,goal)});
  }
  const maxAmt = Math.max(...bars.map(b=>b.amt),goal);
  html += `<div class="bars">`;
  bars.forEach(b=>{
    const h = Math.max(2,(b.amt/maxAmt)*100);
    html += `<div class="bar-col"><div class="bar info" style="height:${h}%"></div><div class="bar-label">${b.d}</div></div>`;
  });
  html += `</div></div>`;
  return html;
}
function quickWater2(amt){ quickWater(amt); }

function renderLogBody(){
  const body = getLatestBody();
  let html = `<div class="card">
    <div class="row between" style="margin-bottom:10px">
      <h3 style="margin:0">${icon('i-scale')}身体数据</h3>
      <button class="btn primary sm" onclick="openBodyModal()">${icon('i-plus')}记录</button>
    </div>`;
  if(body){
    const b = bmi();
    const w = whRatio();
    html += `<div class="grid grid-3" style="text-align:center;margin-bottom:10px">
      <div><div class="muted" style="font-size:11px">BMI</div><div class="big primary">${b}</div></div>
      <div><div class="muted" style="font-size:11px">腰臀比</div><div class="big accent">${w}</div></div>
      <div><div class="muted" style="font-size:11px">BMR</div><div class="big">${bmr(DB.settings)|0}</div></div>
    </div>`;
  }
  // Weight trend（功能四：+7日移动平均）
  if(DB.body.length){
    const sorted = [...DB.body].sort((a,b)=>a.date<b.date?-1:1);
    const recent = sorted.slice(-21); // 前导数据让移动平均更稳
    const ma7 = movingAverage(recent, 7);

    const wArr = recent.map(b=>parseFloat(b.weight)).filter(v=>!isNaN(v));
    const mArr = ma7.map(m=>m.avg).filter(v=>!isNaN(v));
    const min = Math.min(...wArr, ...mArr);
    const max = Math.max(...wArr, ...mArr);
    const range = max-min || 1;
    html += `<div class="section-title">体重趋势（含7日移动平均）</div>`;
    html += `<div class="card">`;
    html += `<div class="line-chart"><svg viewBox="0 0 100 40" preserveAspectRatio="none">`;
    // 实际体重线（半透明 primary）
    if(recent.length > 1){
      const pts = recent.map((b,i)=>`${(i/(recent.length-1))*100},${40-((parseFloat(b.weight)-min)/range)*36-2}`).join(' ');
      html += `<polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="1" opacity="0.4"/>`;
    }
    // 7 日移动平均线（accent 实线）
    if(ma7.length > 1){
      const maPts = ma7.map((m,i)=>`${(i/(ma7.length-1))*100},${40-((m.avg-min)/range)*36-2}`).join(' ');
      html += `<polyline points="${maPts}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
    }
    html += `</svg></div>`;
    // 图例
    html += `<div class="row" style="gap:12px;justify-content:center;margin-top:8px;font-size:11px">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:3px;background:var(--primary);opacity:0.4"></span>实际体重</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:3px;background:var(--accent)"></span>7日平均</span>
    </div>`;
    // 趋势文字
    if(ma7.length >= 2){
      const firstAvg = ma7[0].avg;
      const lastAvg = ma7[ma7.length-1].avg;
      const diff = parseFloat((lastAvg - firstAvg).toFixed(1));
      const trendText = diff > 0 ? `↑ 上升 ${diff}kg` : diff < 0 ? `↓ 下降 ${Math.abs(diff)}kg` : '→ 平稳';
      const trendColor = diff>0?'var(--accent)':diff<0?'var(--primary)':'var(--fg-dim)';
      html += `<div style="text-align:center;margin-top:8px;font-size:13px;font-weight:600;color:${trendColor}">
        21天趋势：${trendText}（7日平均）
      </div>`;
    }
    html += `<div class="row between" style="font-size:11px;margin-top:6px">
      <span class="muted">最低 ${Math.round(min*10)/10}kg</span>
      <span class="muted">最高 ${Math.round(max*10)/10}kg</span>
      <span class="muted">最新 ${body?body.weight+'-kg':'-'}</span>
    </div>`;
    html += `</div>`;
  }else{
    html += `<div class="empty">${icon('i-scale')}<p>暂无数据</p></div>`;
  }
  html += `</div>`;

  // History
  if(DB.body.length){
    html += `<div class="section-title">历史记录</div><div class="card">`;
    [...DB.body].reverse().slice(0,10).forEach(b=>{
      html += `<div class="hist-item">
        <div class="ico">${icon('i-scale')}</div>
        <div class="info">
          <div class="n">${fmtDate(b.date)}</div>
          <div class="m">${b.weight}kg · 体脂${b.bodyFat||'-'}% · 腰${b.waist||'-'} · 臀${b.hip||'-'}</div>
        </div>
        <div class="row" style="gap:4px">
          <button class="icon-btn" style="width:24px;height:24px" onclick="editBody('${b.date}')">${icon('i-edit')}</button>
          <button class="icon-btn" style="width:24px;height:24px" onclick="delBody('${b.date}')">${icon('i-trash')}</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

function renderLogPeriod(){
  const ps = getPeriodStatus();
  let html = `<div class="card">
    <div class="row between" style="margin-bottom:10px">
      <h3 style="margin:0">${icon('i-heart')}生理期记录</h3>
      <button class="btn primary sm" onclick="openPeriodModal()">${icon('i-plus')}记录</button>
    </div>`;
  if(ps){
    html += `<div class="grid grid-2" style="text-align:center;margin-bottom:10px">
      <div><div class="muted" style="font-size:11px">上次开始</div><div class="big">${fmtDate(ps.last.start)}</div></div>
      <div><div class="muted" style="font-size:11px">下次预计</div><div class="big accent">${fmtDate(ps.nextStart)}</div></div>
    </div>`;
    if(ps.isInPeriod){
      html += `<div class="tag danger" style="margin-bottom:6px">经期中</div>`;
    }else if(ps.daysUntil>=0){
      html += `<div class="tag accent">距下次 ${ps.daysUntil} 天</div>`;
    }else{
      html += `<div class="tag warn">已逾期 ${-ps.daysUntil} 天</div>`;
    }
    // 经期训练联动提示
    html += `<div class="hr"></div><div class="kv"><span class="k">经期训练建议</span></div>`;
    html += `<p class="muted" style="font-size:12px;line-height:1.6">经期前3天建议完全休息或低强度恢复，第4-5天起可恢复上肢训练，避免大重量下肢和核心压迫动作。多补水，注意铁质补充。</p>`;
  }else{
    html += `<div class="empty">${icon('i-heart')}<p>暂无记录</p></div>`;
  }
  html += `</div>`;

  // Period calendar (this month)
  const m = new Date();
  const y = m.getFullYear(), mo = m.getMonth();
  const days = new Date(y,mo+1,0).getDate();
  let cells = '';
  ['日','一','二','三','四','五','六'].forEach(d=>cells+=`<div class="dow">${d}</div>`);
  const startDow = new Date(y,mo,1).getDay();
  for(let i=0;i<startDow;i++) cells+=`<div class="day empty"></div>`;
  for(let d=1;d<=days;d++){
    const ds = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const p = DB.period.find(x=>ds>=x.start && ds<=(x.end||addDays(x.start,4)));
    const next = ps && ds===ps.nextStart;
    let cls = 'day';
    if(p) cls+=' period';
    if(next) cls+=' rest';
    if(ds===today()) cls+=' today';
    cells += `<div class="${cls}">${d}${p?'<div class="dot accent"></div>':''}${next?'<div class="dot"></div>':''}</div>`;
  }
  html += `<div class="section-title">本月日历</div><div class="card"><div class="cal">${cells}</div></div>`;

  // History
  if(DB.period.length){
    html += `<div class="section-title">周期统计</div><div class="card">`;
    const sorted = [...DB.period].sort((a,b)=>a.start<b.start?1:-1);
    const avgLen = sorted.length>1 ?
      Math.round((new Date(sorted[0].start)-new Date(sorted[sorted.length-1].start))/86400000/(sorted.length-1)) : 28;
    html += `<div class="kv"><span class="k">记录数</span><span class="v">${sorted.length}</span></div>`;
    html += `<div class="kv"><span class="k">平均周期</span><span class="v">${avgLen}天</span></div>`;
    html += `<div class="kv"><span class="k">最近周期</span><span class="v">${fmtDate(sorted[0].start)}</span></div>`;
    html += `</div>`;
    html += `<div class="section-title">历史</div><div class="card">`;
    sorted.slice(0,6).forEach(p=>{
      html += `<div class="hist-item">
        <div class="ico" style="background:var(--accent-soft)">${icon('i-heart')}</div>
        <div class="info"><div class="n">${fmtDate(p.start)} - ${p.end?fmtDate(p.end):'进行中'}</div>
        <div class="m">${p.flow||'-'} · ${p.symptoms||'无症状'}</div></div>
        <div class="row" style="gap:4px">
          <button class="icon-btn" style="width:24px;height:24px" onclick="editPeriod('${p.id}')">${icon('i-edit')}</button>
          <button class="icon-btn" style="width:24px;height:24px" onclick="delPeriod('${p.id}')">${icon('i-trash')}</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

window.openSleepModal = function(date){
  const dt = date || today();
  let h = (DB.habits||[]).find(x=>x.date===dt) || null;
  if(!h){
    h = {date:dt, sleepEarly:false, stretch:false, meditate:false, drinkMore:false};
  }
  const modal = _byId('modal');
  if(!modal) return;
  modal.innerHTML = `<div class="modal-head"><h2>记录睡眠</h2><button class="icon-btn" onclick="closeModal()">${icon('i-x')}</button></div>
    <div class="field"><label class="label">日期</label><input type="date" id="sDate" value="${h.date}" disabled></div>
    <div class="field-row">
      <div class="field"><label class="label">入睡时间</label><input type="time" id="sStart" value="${h.sleepStart||'23:00'}"></div>
      <div class="field"><label class="label">起床时间</label><input type="time" id="sEnd" value="${h.sleepEnd||'07:00'}"></div>
    </div>
    <div class="field"><label class="label">睡眠时长（自动计算，可手动调整）</label><input type="number" step="0.1" id="sDuration" value="${h.sleepDuration||''}" placeholder="小时"></div>
    <div class="muted" style="font-size:12px;margin-bottom:14px">建议 7-9 小时，深度睡眠对肌肉恢复至关重要</div>
    <button class="btn block primary" onclick="saveSleep()">${icon('i-check')}保存</button>`;
  const bg = document.getElementById('modalBg');
  if(bg) bg.classList.add('active');

  const calc = () => {
    const sStart = document.getElementById('sStart');
    const sEnd = document.getElementById('sEnd');
    const sDur = document.getElementById('sDuration');
    if(!sStart || !sEnd || !sDur) return;
    const start = sStart.value;
    const end = sEnd.value;
    if(start && end){
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      if([sh,sm,eh,em].some(v=>Number.isNaN(v))) return;
      let dur = (eh + em/60) - (sh + sm/60);
      if(dur < 0) dur += 24;
      sDur.value = dur.toFixed(1);
    }
  };
  setTimeout(()=>{
    const sStart = document.getElementById('sStart');
    const sEnd = document.getElementById('sEnd');
    if(sStart) sStart.addEventListener('change', calc);
    if(sEnd) sEnd.addEventListener('change', calc);
  }, 50);
};

window.saveSleep = function(){
  const sDate = document.getElementById('sDate');
  const sStart = document.getElementById('sStart');
  const sEnd = document.getElementById('sEnd');
  const sDuration = document.getElementById('sDuration');
  if(!sDate || !sStart || !sEnd || !sDuration) return;
  const date = sDate.value;
  const start = sStart.value;
  const end = sEnd.value;
  const duration = parseFloat(sDuration.value)||0;

  let h = (DB.habits||[]).find(x=>x.date===date);
  if(!h){
    h = {date, sleepEarly:false, stretch:false, meditate:false, drinkMore:false};
    if(!DB.habits) DB.habits = [];
    DB.habits.push(h);
  }
  h.sleepStart = start;
  h.sleepEnd = end;
  h.sleepDuration = duration;
  // 达标自动打「早睡」卡
  h.sleepEarly = duration >= ((DB.settings && DB.settings.sleepGoal) || 7.5);

  saveDB();
  closeModal();
  render();
  toast(`睡眠记录已保存：${duration}小时`);
};

function switchReportTab(tab){
