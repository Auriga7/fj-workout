}

function renderReport(){
  const tab = state.reportTab;
  let html = `<div class="header"><div><h1>报表<span class="sub">数据复盘</span></h1></div></div>`;
  html += `<div class="row" style="gap:6px;margin-bottom:14px">
    <button class="btn ${tab==='week'?'primary':'ghost'} sm" onclick="switchReportTab('week')">${icon('i-calendar')}周复盘</button>
    <button class="btn ${tab==='month'?'primary':'ghost'} sm" onclick="switchReportTab('month')">${icon('i-chart')}月报</button>
    <button class="btn ${tab==='year'?'primary':'ghost'} sm" onclick="switchReportTab('year')">${icon('i-chart')}年报</button>
  </div>`;
  if(tab==='week') html += renderWeekReport();
  else if(tab==='month') html += renderMonthReport();
  else html += renderYearReport();
  return html;
}

function getWeekRange(){
  // This week Mon-Sun
  const t = new Date();
  const wd = t.getDay();
  const mon = new Date(t);
  mon.setDate(t.getDate() - (wd===0?6:wd-1));
  const sun = new Date(mon);
  sun.setDate(mon.getDate()+6);
  return {
    start: mon.toISOString().slice(0,10),
    end: sun.toISOString().slice(0,10),
    prevStart: addDays(mon.toISOString().slice(0,10),-7)
  };
}

function renderWeekReport(){
  const wr = getWeekRange();
  const wThis = DB.workouts.filter(w=>w.date>=wr.start && w.date<=wr.end);
  const wPrev = DB.workouts.filter(w=>w.date>=wr.prevStart && w.date<=addDays(wr.prevStart,6));
  const trainCount = wThis.filter(w=>w.type!=='rest').length;
  const prevCount = wPrev.filter(w=>w.type!=='rest').length;
  const volThis = wThis.reduce((a,w)=>a+(w.totalVolume||0),0);
  const volPrev = wPrev.reduce((a,w)=>a+(w.totalVolume||0),0);
  const aerobics = wThis.filter(w=>w.type==='rest' && ['swim','walk','recovery'].includes(w.restType)).length + wThis.filter(w=>w.exercises && w.exercises.length===0 && w.type==='rest').length;
  // Warmup/stretch completion
  const wuTotal = wThis.reduce((a,w)=>a+(w.warmups||[]).length,0);
  const wuDone = wThis.reduce((a,w)=>a+(w.warmups||[]).filter(x=>x.done).length,0);
  const wuRate = wuTotal?Math.round(wuDone/wuTotal*100):0;
  const stTotal = wThis.reduce((a,w)=>a+(w.stretches||[]).length,0);
  const stDone = wThis.reduce((a,w)=>a+(w.stretches||[]).filter(x=>x.done).length,0);
  const stRate = stTotal?Math.round(stDone/stTotal*100):0;
  // Nutrition
  let nutDays=0, nutHit=0;
  for(let d=new Date(wr.start); d<=new Date(wr.end); d=addDays(d.toISOString().slice(0,10),1)){
    const ds = d.toISOString().slice(0,10);
    const meals = getMealsOn(ds);
    if(meals.length){
      nutDays++;
      const n = sumNutrition(meals);
      if(n.protein>=DB.settings.proteinGoal*0.8 && n.cal<=DB.settings.caloriesGoal*1.1) nutHit++;
    }
  }
  const nutRate = nutDays?Math.round(nutHit/nutDays*100):0;
  // Water
  let waterDays=0, waterHit=0;
  for(let ds=new Date(wr.start); ds<=new Date(wr.end); ds=addDays(ds.toISOString().slice(0,10),1)){
    const amt = getWaterOn(ds);
    if(amt>0){ waterDays++; if(amt>=DB.settings.waterGoal*0.8) waterHit++; }
  }
  const waterRate = waterDays?Math.round(waterHit/waterDays*100):0;
  // Habits
  let habitTotal=0, habitDone=0;
  for(let ds=new Date(wr.start); ds<=new Date(wr.end); ds=addDays(ds.toISOString().slice(0,10),1)){
    const h = getHabitOn(ds);
    ['sleepEarly','stretch','meditate','drinkMore'].forEach(f=>{
      habitTotal++;
      if(h && h[f]) habitDone++;
    });
  }
  const habitRate = habitTotal?Math.round(habitDone/habitTotal*100):0;
  // Weight change
  const bodiesBefore = DB.body.filter(b=>b.date<wr.start);
  const bodiesAfter = DB.body.filter(b=>b.date>=wr.start && b.date<=wr.end);
  const wBefore = bodiesBefore.length?parseFloat(bodiesBefore[bodiesBefore.length-1].weight):null;
  const wAfter = bodiesAfter.length?parseFloat(bodiesAfter[bodiesAfter.length-1].weight):null;
  const wChange = (wBefore&&wAfter)?(wAfter-wBefore).toFixed(1):null;

  // 功能三：平均睡眠统计
  let sleepTotal = 0, sleepDays = 0;
  for(let ds=new Date(wr.start); ds<=new Date(wr.end); ds=addDays(ds.toISOString().slice(0,10),1)){
    const dStr = ds.toISOString().slice(0,10);
    const h = getHabitOn(dStr);
    if(h && h.sleepDuration){ sleepTotal += parseFloat(h.sleepDuration)||0; sleepDays++; }
  }
  const avgSleep = sleepDays ? (sleepTotal/sleepDays).toFixed(1) : null;

  // 功能五：基于 DB.cardio 的有氧统计（替换原 aerobics 估算）
  const weekCardio = (DB.cardio||[]).filter(c=>c.date>=wr.start && c.date<=wr.end);
  const cardioCount = weekCardio.length;
  const cardioMin = weekCardio.reduce((a,c)=>a+parseFloat(c.duration||0),0);

  // Suggestions
  const sug = [];
  if(trainCount<3) sug.push('训练次数偏少，建议保证每周3-4次训练。');
  else if(trainCount>=4) sug.push('训练频率充足，注意恢复。');
  if(wuRate<80) sug.push('热身完成率不足，建议每次训练前完成全部热身。');
  if(stRate<80) sug.push('拉伸完成率不足，建议训练后认真拉伸。');
  if(nutRate<70) sug.push('蛋白质摄入不达标天数较多，注意补充。');
  if(waterRate<70) sug.push('饮水不规律，建议养成定时喝水习惯。');
  if(habitRate<60) sug.push('习惯打卡完成率低，可从一项开始坚持。');
  if(wChange!==null){
    if(parseFloat(wChange)<-0.5) sug.push(`体重下降 ${Math.abs(wChange)}kg，注意热量是否过低。`);
    else if(parseFloat(wChange)>0.5) sug.push(`体重上升 ${wChange}kg，关注饮食结构。`);
  }
  if(!sug.length) sug.push('本周各项指标均衡，继续保持！');

  let html = `<div class="card">
    <h3>${icon('i-calendar')}本周复盘</h3>
    <div class="muted" style="font-size:12px;margin-bottom:12px">${fmtDate(wr.start)} - ${fmtDate(wr.end)}</div>
    <div class="grid grid-2" style="gap:10px">
      ${reportStat('训练次数', trainCount, '次', prevCount, trainCount>=3)}
      ${reportStat('总容量', volThis, 'kg', volPrev, volThis>=volPrev)}
      ${reportStat('热身完成率', wuRate, '%', null, wuRate>=80)}
      ${reportStat('拉伸完成率', stRate, '%', null, stRate>=80)}
      ${reportStat('营养达标率', nutRate, '%', null, nutRate>=70)}
      ${reportStat('饮水达标率', waterRate, '%', null, waterRate>=70)}
      ${reportStat('有氧次数', cardioCount, '次', null, cardioCount>=2)}
      ${reportStat('有氧时长', cardioMin, 'min', null, cardioMin>=75)}
      ${reportStat('习惯完成率', habitRate, '%', null, habitRate>=60)}
      ${wChange!==null?reportStat('体重变化', wChange, 'kg', null, parseFloat(wChange)<=0):''}
      ${avgSleep!==null?reportStat('平均睡眠', avgSleep, 'h', null, parseFloat(avgSleep)>=7):''}
      ${(()=>{
        const fBefore = bodiesBefore.length?parseFloat(bodiesBefore[bodiesBefore.length-1].bodyFat):null;
        const fAfter = bodiesAfter.length?parseFloat(bodiesAfter[bodiesAfter.length-1].bodyFat):null;
        const fChange = (fBefore&&fAfter)?(fAfter-fBefore).toFixed(1):null;
        return fChange!==null?reportStat('体脂变化', fChange, '%', null, parseFloat(fChange)<=0):'';
      })()}
    </div>
  </div>`;

  // Volume trend bar chart (7 days)
  html += `<div class="section-title">每日训练容量</div><div class="card">`;
  const dayVols = [];
  for(let i=0;i<7;i++){
    const ds = addDays(wr.start,i);
    const v = DB.workouts.filter(w=>w.date===ds).reduce((a,w)=>a+(w.totalVolume||0),0);
    dayVols.push({d:['一','二','三','四','五','六','日'][i],v});
  }
  const maxV = Math.max(...dayVols.map(x=>x.v),1000);
  html += `<div class="bars">`;
  dayVols.forEach(x=>{
    const h = x.v>0?Math.max(2,(x.v/maxV)*100):0;
    html += `<div class="bar-col"><div class="bar" style="height:${h}%">${x.v>0?`<div class="bar-val">${x.v}</div>`:''}</div><div class="bar-label">${x.d}</div></div>`;
  });
  html += `</div></div>`;

  // Suggestions
  html += `<div class="section-title">本周建议</div><div class="card">`;
  sug.forEach(s=>{
    html += `<div style="padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:13px;display:flex;gap:8px;align-items:flex-start"><span class="primary">·</span><span>${s}</span></div>`;
  });
  html += `</div>`;
  return html;
}

function reportStat(label,val,unit,prev,good){
  const trend = prev!==null && prev!==undefined ? (val>prev?'↑':val<prev?'↓':'=') : '';
  const trendCls = trend==='↑'?'primary':trend==='↓'?'accent':'';
  return `<div style="background:var(--bg-soft);border-radius:10px;padding:10px">
    <div class="muted" style="font-size:11px">${label}</div>
    <div class="row" style="align-items:baseline;gap:4px;margin-top:2px">
      <span class="big ${good?'primary':''}" style="font-size:20px">${val}</span>
      <span class="muted" style="font-size:11px">${unit}</span>
      ${trend?`<span class="${trendCls}" style="font-size:11px;margin-left:auto">${trend}${prev!==null&&prev!==undefined?prev:''}</span>`:''}
    </div>
  </div>`;
}

function renderMonthReport(){
  const m = state.calMonth;
  const y = m.getFullYear(), mo = m.getMonth();
  const prevM = new Date(y, mo-1, 1);
  const nextM = new Date(y, mo+1, 1);
  const prevLabel = `${prevM.getMonth()+1}月`;
  const nextLabel = `${nextM.getMonth()+1}月`;
  const monthStart = `${y}-${String(mo+1).padStart(2,'0')}-01`;
  const monthEnd = `${y}-${String(mo+1).padStart(2,'0')}-${String(new Date(y,mo+1,0).getDate()).padStart(2,'0')}`;
  const ws = DB.workouts.filter(w=>w.date>=monthStart && w.date<=monthEnd);
  const nonRest = ws.filter(w=>w.type!=='rest');
  let html = `<div class="card">
    <div class="row between">
      <h3 style="margin:0">${icon('i-chart')}${y}年${mo+1}月报</h3>
      <div class="row" style="gap:6px">
        <button class="btn ghost sm" onclick="calMove(-1)">${icon('i-chev-l')} ${prevLabel}</button>
        <button class="btn ghost sm" onclick="calMove(1)">${nextLabel} ${icon('i-chev-r')}</button>
      </div>
    </div>
    <div class="grid grid-3" style="margin-top:10px">
      <div class="kv"><span class="k">训练次数</span><span class="v primary">${nonRest.length}</span></div>
      <div class="kv"><span class="k">总容量</span><span class="v">${ws.reduce((a,w)=>a+(w.totalVolume||0),0)}kg</span></div>
      <div class="kv"><span class="k">平均时长</span><span class="v">${nonRest.length?Math.round(nonRest.reduce((a,w)=>a+(w.duration||0),0)/nonRest.length):0}min</span></div>
    </div>
  </div>`;

  // Muscle frequency bar chart
  html += `<div class="section-title">肌群频次</div><div class="card">`;
  const muscleCount = {};
  nonRest.forEach(w=>{
    (w.exercises||[]).forEach(e=>{
      const m = e.muscle||'其他';
      muscleCount[m] = (muscleCount[m]||0)+1;
    });
  });
  const muscles = Object.entries(muscleCount).sort((a,b)=>b[1]-a[1]);
  if(muscles.length){
    const maxM = Math.max(...muscles.map(x=>x[1]));
    html += `<div style="display:flex;flex-direction:column;gap:6px">`;
    muscles.forEach(([m,c])=>{
      html += `<div class="row between" style="gap:8px;align-items:center">
        <span style="font-size:12px;width:60px;flex-shrink:0">${m}</span>
        <div class="progress" style="flex:1"><div style="width:${(c/maxM)*100}%"></div></div>
        <span class="primary" style="font-size:12px;font-weight:700;width:20px;text-align:right">${c}</span>
      </div>`;
    });
    html += `</div>`;
  }else{
    html += `<div class="empty"><p>本月无训练数据</p></div>`;
  }
  html += `</div>`;

  // Heatmap (training intensity by day)
  html += `<div class="section-title">训练热力图</div><div class="card">`;
  const days = new Date(y,mo+1,0).getDate();
  const firstDow = new Date(y,mo,1).getDay();
  html += `<div class="heatmap">`;
  for(let i=0;i<firstDow;i++) html += `<div class="heat-cell" style="visibility:hidden"></div>`;
  for(let d=1;d<=days;d++){
    const ds = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const v = DB.workouts.filter(w=>w.date===ds).reduce((a,w)=>a+(w.totalVolume||0),0);
    let lvl = '';
    if(v>0){
      if(v<2000) lvl='l1';
      else if(v<4000) lvl='l2';
      else if(v<6000) lvl='l3';
      else lvl='l4';
    }
    html += `<div class="heat-cell ${lvl}" title="${d}日: ${v}kg"></div>`;
  }
  html += `</div>`;
  html += `<div class="row" style="gap:6px;margin-top:10px;font-size:10px;justify-content:center">
    <span class="muted">少</span>
    <div class="heat-cell" style="width:12px;height:12px"></div>
    <div class="heat-cell l1" style="width:12px;height:12px"></div>
    <div class="heat-cell l2" style="width:12px;height:12px"></div>
    <div class="heat-cell l3" style="width:12px;height:12px"></div>
    <div class="heat-cell l4" style="width:12px;height:12px"></div>
    <span class="muted">多</span>
  </div></div>`;

  // Weight & BodyFat stats
  const monthBodies = DB.body.filter(b=>b.date>=monthStart && b.date<=monthEnd).sort((a,b)=>a.date<b.date?-1:1);
  if(monthBodies.length){
    const firstW = parseFloat(monthBodies[0].weight);
    const lastW = parseFloat(monthBodies[monthBodies.length-1].weight);
    const avgW = (monthBodies.reduce((a,b)=>a+parseFloat(b.weight),0)/monthBodies.length).toFixed(1);
    const wChange = (lastW-firstW).toFixed(1);
    
    let fatChange = '-';
    const firstF = monthBodies.find(b=>b.bodyFat);
    const lastF = [...monthBodies].reverse().find(b=>b.bodyFat);
    if(firstF && lastF){
      fatChange = (parseFloat(lastF.bodyFat)-parseFloat(firstF.bodyFat)).toFixed(1);
    }
    
    html += `<div class="section-title">本月身体变化</div><div class="card">
      <div class="grid grid-2" style="gap:10px;margin-bottom:10px">
        <div style="background:var(--bg-soft);border-radius:10px;padding:12px;text-align:center">
          <div class="muted" style="font-size:11px">体重变化</div>
          <div class="big ${parseFloat(wChange)<=0?'primary':'accent'}" style="font-size:22px">${wChange>0?'+':''}${wChange}kg</div>
          <div class="muted" style="font-size:11px">平均 ${avgW}kg</div>
        </div>
        <div style="background:var(--bg-soft);border-radius:10px;padding:12px;text-align:center">
          <div class="muted" style="font-size:11px">体脂率变化</div>
          <div class="big ${fatChange!=='-' && parseFloat(fatChange)<=0?'primary':'accent'}" style="font-size:22px">${fatChange!=='-'?(parseFloat(fatChange)>0?'+':'')+fatChange+'%':'-'}</div>
          <div class="muted" style="font-size:11px">${firstF?firstF.bodyFat+'% → '+lastF.bodyFat+'%':'无数据'}</div>
        </div>
      </div>
      <div class="grid grid-3" style="text-align:center;font-size:12px">
        <div><div class="muted" style="font-size:10px">月初体重</div><div class="v">${firstW}kg</div></div>
        <div><div class="muted" style="font-size:10px">月末体重</div><div class="v">${lastW}kg</div></div>
        <div><div class="muted" style="font-size:10px">记录天数</div><div class="v">${monthBodies.length}天</div></div>
      </div>
    </div>`;
  }

  // Weight curve
  const bodies = DB.body.filter(b=>b.date>=monthStart && b.date<=monthEnd).sort((a,b)=>a.date<b.date?-1:1);
  if(bodies.length>1){
    html += `<div class="section-title">体重曲线</div><div class="card">`;
    const min = Math.min(...bodies.map(b=>parseFloat(b.weight)));
    const max = Math.max(...bodies.map(b=>parseFloat(b.weight)));
    const range = max-min || 1;
    html += `<div class="line-chart"><svg viewBox="0 0 100 40" preserveAspectRatio="none">`;
    const pts = bodies.map((b,i)=>`${(i/(bodies.length-1))*100},${40-((parseFloat(b.weight)-min)/range)*36-2}`).join(' ');
    html += `<polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="1.5"/>`;
    bodies.forEach((b,i)=>{
      const x = (i/(bodies.length-1))*100;
      const yy = 40-((parseFloat(b.weight)-min)/range)*36-2;
      html += `<circle cx="${x}" cy="${yy}" r="1" fill="var(--primary)"/>`;
    });
    html += `</svg></div>`;
    html += `<div class="row between" style="font-size:11px;margin-top:6px">
      <span class="muted">最低 ${min}kg</span>
      <span class="muted">最高 ${max}kg</span>
      <span class="muted">${bodies.length}个记录</span>
    </div></div>`;
  }

  // Body fat curve
  const bodiesFat = DB.body.filter(b=>b.date>=monthStart && b.date<=monthEnd && b.bodyFat).sort((a,b)=>a.date<b.date?-1:1);
  if(bodiesFat.length>1){
    html += `<div class="section-title">体脂率趋势</div><div class="card">`;
    const minF = Math.min(...bodiesFat.map(b=>parseFloat(b.bodyFat)));
    const maxF = Math.max(...bodiesFat.map(b=>parseFloat(b.bodyFat)));
    const rangeF = maxF-minF || 1;
    html += `<div class="line-chart"><svg viewBox="0 0 100 40" preserveAspectRatio="none">`;
    const ptsF = bodiesFat.map((b,i)=>`${(i/(bodiesFat.length-1))*100},${40-((parseFloat(b.bodyFat)-minF)/rangeF)*36-2}`).join(' ');
    html += `<polyline points="${ptsF}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>`;
    bodiesFat.forEach((b,i)=>{
      const x = (i/(bodiesFat.length-1))*100;
      const yy = 40-((parseFloat(b.bodyFat)-minF)/rangeF)*36-2;
      html += `<circle cx="${x}" cy="${yy}" r="1" fill="var(--accent)"/>`;
    });
    html += `</svg></div>`;
    html += `<div class="row between" style="font-size:11px;margin-top:6px">
      <span class="muted">最低 ${minF}%</span>
      <span class="muted">最高 ${maxF}%</span>
      <span class="muted">${bodiesFat.length}个记录</span>
    </div></div>`;
  }

  // PRs
  const prEntries = Object.entries(DB.prs);
  html += `<div class="section-title">PR 最佳重量</div>`;
  if(prEntries.length){
    html += `<div class="card">`;
    prEntries.sort((a,b)=>b[1]-a[1]).forEach(([n,w])=>{
      const r1 = DB.prs1RM ? (DB.prs1RM[n]||null) : null;
      html += `<div class="hist-item" style="margin-bottom:6px">
        <div class="ico" style="background:var(--accent-soft)">${icon('i-trophy')}</div>
        <div class="info"><div class="n">${n}</div><div class="m">个人最佳</div>${r1?`<div class="m">1RM ≈ ${r1}kg</div>`:''}</div>
        <span class="tag accent">${w}kg</span>
      </div>`;
    });
    html += `</div>`;
  }else{
    html += `<div class="card"><div class="empty">${icon('i-trophy')}<p>暂无PR记录</p></div></div>`;
  }

  // Circumference trend
  if(bodies.length){
    html += `<div class="section-title">围度趋势</div><div class="card">`;
    const last = bodies[bodies.length-1];
    const first = bodies[0];
    ['waist','hip','thigh','arm'].forEach(f=>{
      const labels = {waist:'腰围',hip:'臀围',thigh:'大腿',arm:'上臂'};
      const fv = parseFloat(first[f]||0);
      const lv = parseFloat(last[f]||0);
      const diff = lv-fv;
      const sign = diff>0?'+':'';
      html += `<div class="row between" style="padding:5px 0;font-size:12px">
        <span class="dim">${labels[f]}</span>
        <span><span class="muted">${fv||'-'} → </span><span class="v">${lv||'-'}</span> <span class="${diff<0?'primary':'accent'}" style="font-size:11px">${fv&&lv?sign+diff.toFixed(1):''}</span></span>
      </div>`;
    });
    html += `</div>`;
  }

  // Period records this month
  const periods = DB.period.filter(p=>p.start>=monthStart && p.start<=monthEnd);
  html += `<div class="section-title">生理期记录</div>`;
  if(periods.length){
    html += `<div class="card">`;
    periods.forEach(p=>{
      const len = p.end?Math.round((new Date(p.end)-new Date(p.start))/86400000)+1:5;
      html += `<div class="hist-item" style="margin-bottom:6px">
        <div class="ico" style="background:var(--accent-soft)">${icon('i-heart')}</div>
        <div class="info"><div class="n">${fmtDate(p.start)} - ${p.end?fmtDate(p.end):'进行中'}</div>
        <div class="m">${len}天 · ${p.flow||'-'} · ${p.symptoms||'无症状'}</div></div>
      </div>`;
    });
    html += `</div>`;
  }else{
    html += `<div class="card"><div class="empty">${icon('i-heart')}<p>本月无生理期记录</p></div></div>`;
  }

  return html;
}

function renderYearReport(){
  const y = state.calMonth.getFullYear();
  const yearStart = `${y}-01-01`;
  const yearEnd = `${y}-12-31`;
  const ws = DB.workouts.filter(w=>w.date>=yearStart && w.date<=yearEnd);
  const nonRest = ws.filter(w=>w.type!=='rest');
  
  let html = `<div class="card">
    <div class="row between">
      <h3 style="margin:0">${icon('i-chart')}${y}年度总览</h3>
      <div class="row" style="gap:6px">
        <button class="icon-btn" onclick="calMove(-12)">${icon('i-chev-l')} 上年</button>
        <button class="icon-btn" onclick="calMove(12)">下年 ${icon('i-chev-r')}</button>
      </div>
    </div>

    </div>
  </div>`;

  // 12个月柱状图
  html += `<div class="section-title">月度训练次数</div><div class="card">`;
  const months = [];
  for(let m=0;m<12;m++){
    const mStart = `${y}-${String(m+1).padStart(2,'0')}-01`;
    const mEnd = `${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`;
    const count = DB.workouts.filter(w=>w.date>=mStart && w.date<=mEnd && w.type!=='rest').length;
    months.push({label:`${m+1}月`,count});
  }
  const maxC = Math.max(...months.map(x=>x.count),1);
  html += `<div class="bars">`;
  months.forEach(m=>{
    const h = m.count>0?Math.max(4,(m.count/maxC)*100):2;
    html += `<div class="bar-col"><div class="bar" style="height:${h}%">${m.count>0?`<div class="bar-val">${m.count}</div>`:''}</div><div class="bar-label">${m.label}</div></div>`;
  });
  html += `</div></div>`;

  // 全年PR汇总
  const prEntries = Object.entries(DB.prs);
  html += `<div class="section-title">年度 PR 汇总</div>`;
  if(prEntries.length){
    html += `<div class="card">`;
    prEntries.sort((a,b)=>b[1]-a[1]).forEach(([n,w])=>{
      const r1 = DB.prs1RM ? (DB.prs1RM[n]||null) : null;
      html += `<div class="hist-item" style="margin-bottom:6px">
        <div class="ico" style="background:var(--accent-soft)">${icon('i-trophy')}</div>
        <div class="info"><div class="n">${n}</div><div class="m">个人最佳</div>${r1?`<div class="m">1RM ≈ ${r1}kg</div>`:''}</div>
        <span class="tag accent">${w}kg</span>
      </div>`;
    });
    html += `</div>`;
  }else{
    html += `<div class="card"><div class="empty">${icon('i-trophy')}<p>暂无PR记录</p></div></div>`;
  }

  return html;
}

// Theme toggle

function switchCycle(cycle){
  if(DB.plans.currentCycle === cycle) return;
  if(!confirm(`确认切换至 ${cycle} 循环？当前循环进度将重置`)) return;
  DB.plans.currentCycle = cycle;
  const t=today(); const w=dow(t);
  DB.plans[cycle].forEach((item,i)=>{
    item.completed = false;
    if(i===0){
      const diff = ((item.day-w+7)%7);
      item.lastScheduledDate = addDays(t, diff===0 ? 0 : diff);
    }else{
      const prev = DB.plans[cycle][i-1];
      const gap = Math.max(1, ((item.day-prev.day+7)%7) || 2);
      item.lastScheduledDate = addDays(prev.lastScheduledDate, gap);
    }
  });
  saveDB();
  render();
  toast(`已切换至 ${cycle} 循环`);
}

    html += `<div class="section-title">${cycle}循环</div><div class="card" style="margin-bottom:12px">`;
    const plans = cycle==='A'?PLAN_A:PLAN_B;
    plans.forEach(p=>{

function pfAvPickFile(inp){
  const file = inp && inp.files && inp.files[0];
  if(!file) return;
  if(file.size > 4 * 1024 * 1024){ toast('图片过大，请使用 4MB 以内的图片'); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const dataUrl = ev.target && ev.target.result;
    if(!dataUrl) return;
    // Store in hidden input; saveProfile will persist it
    const hid = document.getElementById('pfAvatar');
    if(hid) hid.value = dataUrl;
    // Swap preview
    const wrap = document.getElementById('pfAvWrap');
    const img = document.getElementById('pfAvImg');
    if(img){ img.src = dataUrl; img.style.display='block'; }
    else if(wrap){ wrap.innerHTML = `<img id="pfAvImg" src="${dataUrl}" alt="头像预览" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%">`; }
    toast('头像已载入，点击保存才会生效');
  };
  reader.onerror = function(){ toast('读取图片失败'); };
  reader.readAsDataURL(file);
}

function exportJSON(){
  try{
    const data = JSON.stringify(DB,null,2);
    const blob = new Blob([data],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `fj-${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('已导出 JSON');
  }catch(e){ toast('导出失败：'+e.message); }
}

function importJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.settings) throw new Error('格式不对');
      DB = Object.assign(defaultData(),data);
      saveDB();
      render();
      toast('导入成功');
    }catch(err){
      toast('导入失败：'+err.message);
    }
  };
  reader.readAsText(file);
}

function exportCSV(){

      csv += `喝水,${w.date},"${w.time} ${w.amount}ml"\n`;

    DB.body.forEach(b=>{
      csv += `身体,${b.date},"${b.weight}kg 体脂${b.bodyFat||'-'}%"\n`;

      csv += `习惯,${h.date},"早睡${h.sleepEarly?1:0} 拉伸${h.stretch?1:0} 冥想${h.meditate?1:0} 多喝水${h.drinkMore?1:0}"\n`;

function setDelRange(n){
  const end = today();
  const start = addDays(end,n);
  document.getElementById('dStart').value = start;
  document.getElementById('dEnd').value = end;
}
function deleteByRange(){
  const start = document.getElementById('dStart').value;
  const end = document.getElementById('dEnd').value;
  if(!start||!end){ toast('请选择日期'); return; }
  if(!confirm(`确认删除 ${fmtDate(start)} 至 ${fmtDate(end)} 的所有数据？`)) return;
  DB.workouts = DB.workouts.filter(w=>!(w.date>=start && w.date<=end));
  DB.meals = DB.meals.filter(m=>!(m.date>=start && m.date<=end));
  DB.water = DB.water.filter(w=>!(w.date>=start && w.date<=end));
  DB.body = DB.body.filter(b=>!(b.date>=start && b.date<=end));
  DB.habits = DB.habits.filter(h=>!(h.date>=start && h.date<=end));
  DB.period = DB.period.filter(p=>!((p.start>=start && p.start<=end)));
  saveDB();
  closeModal();
  render();
  toast('已删除');
}

        {i:'i-settings',t:'完全可定制',d:'目标、主题随心调整'}
      ]
    }
  ];
  const s = steps[onboardStep] || steps[0];
  const inner = document.getElementById('onboardInner');
  if(!inner) return;
  inner.innerHTML = `
    <div class="onboard-logo"><svg><use href="#i-dumbbell"/></svg></div>
    <h1>${s.title}</h1>
    <p>${s.desc}</p>
    <div class="onboard-features">
      ${s.features.map(f=>`<div class="onboard-feat">
        <div class="ico"><svg><use href="#${f.i}"/></svg></div>
        <div><h4>${f.t}</h4><p>${f.d}</p></div>
      </div>`).join('')}
    </div>
    ${onboardStep===2?`<div style="width:100%;display:flex;flex-direction:column;gap:10px;margin-bottom:30px">
      <input id="obNick" placeholder="输入你的昵称" value="${DB.settings.nickname||'健身达人'}" style="width:100%;padding:12px 14px;background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--fg);font-size:14px;outline:none">

    </div>`:''}
    <div class="onboard-steps">
      ${[0,1,2].map(i=>`<div class="onboard-step ${i===onboardStep?'active':''}"></div>`).join('')}
    </div>
    <div class="row" style="gap:10px;width:100%">
      ${onboardStep>0?`<button class="btn ghost block" onclick="onboardBack()">${icon('i-chev-l')}上一步</button>`:''}
      <button class="btn primary block" onclick="onboardNext()">${onboardStep<2?'下一步':'开始使用'}${icon('i-chev-r')}</button>
    </div>
  `;
}
function onboardNext(){
  if(onboardStep<2){ onboardStep++; renderOnboardStep(); }
  else{
    const nickEl = document.getElementById('obNick');
    const hEl = document.getElementById('obHeight');
    if(nickEl){
      const v = (nickEl.value||'').trim();
      if(v) DB.settings.nickname = v;
    }
    if(hEl){
      const hv = parseInt(hEl.value);
      if(hv && hv>100 && hv<250) DB.settings.height = hv;
    }
    DB.onboarded = true;
    saveDB();
    const ob = document.getElementById('onboard');
    if(ob) ob.classList.remove('active');
    render();
  }
}
function onboardBack(){
  if(onboardStep>0){ onboardStep--; renderOnboardStep(); }
}

function init(){
  // 注册 PWA Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('[FJ] SW 注册成功'))
      .catch(err => console.log('[FJ] SW 注册失败', err));
  }

  try{
    loadDB();
    applyTheme();
    if(!DB.onboarded){
      startOnboarding();
    }
    render();
  }catch(err){
    console.error('[FJ] init failed:', err);
    if(window.toast){ try{ toast('初始化失败：'+(err&&err.message?err.message:err)); }catch(e){} }
  }
}

// 功能六：自定义训练模板列表页
function renderTemplates(){
  let html = `<div class="header"><div><h1>我的模板<span class="sub">自定义训练计划</span></h1></div>
    <button class="btn primary sm" onclick="openTemplateModal()">${icon('i-plus')}新建模板</button></div>`;

  const tmpls = DB.templates || [];
  if(!tmpls.length){
    html += `<div class="card"><div class="empty">${icon('i-list')}<p>暂无自定义模板，点击上方按钮创建</p></div></div>`;
  }else{
    tmpls.forEach(t => {
      html += `<div class="card" style="margin-bottom:12px">
        <div class="row between" style="margin-bottom:10px">
          <h3 style="margin:0">${t.name}</h3>
          <div class="row" style="gap:6px">
            <button class="btn primary sm" onclick="startTemplateWorkout('${t.id}')">${icon('i-play')}开始</button>
            <button class="btn ghost sm" onclick="editTemplate('${t.id}')">${icon('i-edit')}</button>
            <button class="btn danger sm" onclick="delTemplate('${t.id}')">${icon('i-trash')}</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${(t.exercises||[]).map((e,i)=>`<div class="row between" style="font-size:12px;padding:3px 0">
            <span>${i+1}. ${e.name} <span class="muted">${e.muscle||''}</span></span>
            <span class="muted">${e.setsCount||'-'}组 × ${e.repsPreset||'?'}次 ${e.weightPreset?'@'+e.weightPreset+'kg':''}</span>
          </div>`).join('')}
        </div>
      </div>`;
    });
  }
  html += `<button class="btn ghost block" style="margin-top:10px" onclick="navigate('library')">${icon('i-chev-l')}返回动作库</button>`;
  return html;
}

function renderExerciseLibrary(){
  const filter = state.libraryFilter;
  const muscles = ['全部','胸','背','肩','手臂','腿','核心'];
  const list = filter==='全部' ? DB.exerciseLibrary : DB.exerciseLibrary.filter(e=>e.muscle===filter);
  
  let html = `<div class="header"><div><h1>动作库<span class="sub">${DB.exerciseLibrary.length} 个动作</span></h1></div>
    <button class="btn primary sm" onclick="openAddExerciseModal()">${icon('i-plus')}添加动作</button></div>`;
  
  // 功能六：从动作库进入模板管理
  html += `<div class="row" style="gap:8px;margin-bottom:12px">
    <button class="btn primary" onclick="openTemplateModal()">${icon('i-plus')}新建训练模板</button>
    <button class="btn ghost" onclick="navigate('templates')">${icon('i-list')}我的模板</button>
  </div>`;

  // 部位筛选
  html += `<div class="row" style="gap:6px;margin-bottom:14px;overflow-x:auto;flex-wrap:nowrap">`;
  muscles.forEach(m=>{
    html += `<button class="btn ${filter===m?'primary':'ghost'} sm" onclick="filterLibrary('${m}')">${m}</button>`;
  });
  html += `</div>`;
  
  // 动作列表
  if(!list.length){
    html += `<div class="card"><div class="empty">${icon('i-dumbbell')}<p>该分类暂无动作</p></div></div>`;
  }else{
    html += `<div style="display:flex;flex-direction:column;gap:10px">`;
    list.forEach(ex=>{
      html += `<div class="card" style="padding:14px">
        <div class="row between" style="margin-bottom:8px;align-items:center">
          <div>
            <div style="font-weight:700;font-size:15px">${ex.name}</div>
            <div class="muted" style="font-size:12px;margin-top:2px">${ex.muscle} · ${ex.steps.length}个步骤</div>
          </div>
          <div class="row" style="gap:6px">
            <button class="btn ghost sm" onclick="showExerciseDemo('${ex.name}','${ex.muscle}')">${icon('i-eye')}教学</button>
            <button class="btn ghost sm" onclick="editExercise('${ex.id}')">${icon('i-edit')}</button>
            <button class="btn danger sm" onclick="deleteExercise('${ex.id}')">${icon('i-trash')}</button>
          </div>
        </div>
        <div class="row" style="gap:6px;flex-wrap:wrap">
          ${ex.steps.slice(0,2).map(s=>`<span class="tag" style="font-size:11px">${s.substring(0,12)}${s.length>12?'...':''}</span>`).join('')}
          ${ex.steps.length>2?`<span class="tag" style="font-size:11px">+${ex.steps.length-2}</span>`:''}
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  
  html += `<button class="btn ghost block" style="margin-top:14px" onclick="navigate('train')">${icon('i-chev-l')}返回训练日历</button>`;
  return html;
}

function filterLibrary(muscle){
  state.libraryFilter = muscle;
  render();
}

function openAddExerciseModal(){
  const modal = document.getElementById('modal');
  modal.innerHTML = `<div class="modal-head"><h2>添加新动作</h2><button class="icon-btn" onclick="closeModal()">${icon('i-x')}</button></div>
    <div class="field"><label class="label">动作名称</label><input id="exName" placeholder="如：哑铃卧推"></div>
    <div class="field"><label class="label">目标肌群</label>
      <select id="exMuscle">
        <option>胸</option><option>背</option><option>肩</option><option>手臂</option><option>腿</option><option>核心</option>
      </select>
    </div>
    <div class="field"><label class="label">动作类型</label>
      <select id="exDemoType">
        <option value="push">推类</option><option value="fly">夹胸/飞鸟</option><option value="pulldown">下拉</option>
        <option value="row">划船</option><option value="sideRaise">侧平举</option><option value="curl">弯举</option>
        <option value="pushdown">下压/臂屈伸</option><option value="legExtension">腿屈伸</option><option value="legCurl">腿弯举</option>
        <option value="hipThrust">臀推/髋外展</option><option value="crunch">卷腹</option><option value="facePull">面拉</option>
        <option value="calfRaise">提踵</option>
      </select>
    </div>
    <div class="field"><label class="label">步骤（每行一个）</label><textarea id="exSteps" rows="4" placeholder="1. 调整座椅&#10;2. 呼气发力&#10;3. 顶峰收缩&#10;4. 吸气回放"></textarea></div>
    <div class="field"><label class="label">常见错误（每行一个）</label><textarea id="exErrors" rows="3" placeholder="1. 耸肩借力&#10;2. 幅度不足"></textarea></div>
    <button class="btn block primary" onclick="saveExercise()">${icon('i-check')}保存动作</button>`;
  document.getElementById('modalBg').classList.add('active');
}

function saveExercise(){
  const name = document.getElementById('exName').value.trim();
  const muscle = document.getElementById('exMuscle').value;
  const demoType = document.getElementById('exDemoType').value;
  const steps = document.getElementById('exSteps').value.split('\n').map(s=>s.trim()).filter(s=>s);
  const errors = document.getElementById('exErrors').value.split('\n').map(s=>s.trim()).filter(s=>s);
  if(!name){ toast('请输入动作名称'); return; }
  if(!steps.length){ toast('请至少填写一个步骤'); return; }
  DB.exerciseLibrary.push({id:uid(),name,muscle,demoType,steps,errors});
  saveDB();
  closeModal();
  render();
  toast('动作已添加');
}

function editExercise(id){
  const ex = DB.exerciseLibrary.find(e=>e.id===id);
  if(!ex) return;
  const modal = document.getElementById('modal');
  modal.innerHTML = `<div class="modal-head"><h2>编辑动作</h2><button class="icon-btn" onclick="closeModal()">${icon('i-x')}</button></div>
    <div class="field"><label class="label">动作名称</label><input id="exName" value="${ex.name}"></div>
    <div class="field"><label class="label">目标肌群</label>
      <select id="exMuscle">
        <option ${ex.muscle==='胸'?'selected':''}>胸</option>
        <option ${ex.muscle==='背'?'selected':''}>背</option>
        <option ${ex.muscle==='肩'?'selected':''}>肩</option>
        <option ${ex.muscle==='手臂'?'selected':''}>手臂</option>
        <option ${ex.muscle==='腿'?'selected':''}>腿</option>
        <option ${ex.muscle==='核心'?'selected':''}>核心</option>
      </select>
    </div>
    <div class="field"><label class="label">动作类型</label>
      <select id="exDemoType">
        <option value="push" ${ex.demoType==='push'?'selected':''}>推类</option>
        <option value="fly" ${ex.demoType==='fly'?'selected':''}>夹胸/飞鸟</option>
        <option value="pulldown" ${ex.demoType==='pulldown'?'selected':''}>下拉</option>
        <option value="row" ${ex.demoType==='row'?'selected':''}>划船</option>
        <option value="sideRaise" ${ex.demoType==='sideRaise'?'selected':''}>侧平举</option>
        <option value="curl" ${ex.demoType==='curl'?'selected':''}>弯举</option>
        <option value="pushdown" ${ex.demoType==='pushdown'?'selected':''}>下压/臂屈伸</option>
        <option value="legExtension" ${ex.demoType==='legExtension'?'selected':''}>腿屈伸</option>
        <option value="legCurl" ${ex.demoType==='legCurl'?'selected':''}>腿弯举</option>
        <option value="hipThrust" ${ex.demoType==='hipThrust'?'selected':''}>臀推/髋外展</option>
        <option value="crunch" ${ex.demoType==='crunch'?'selected':''}>卷腹</option>
        <option value="facePull" ${ex.demoType==='facePull'?'selected':''}>面拉</option>
        <option value="calfRaise" ${ex.demoType==='calfRaise'?'selected':''}>提踵</option>
      </select>
    </div>
    <div class="field"><label class="label">步骤（每行一个）</label><textarea id="exSteps" rows="4">${ex.steps.join('\n')}</textarea></div>
    <div class="field"><label class="label">常见错误（每行一个）</label><textarea id="exErrors" rows="3">${ex.errors.join('\n')}</textarea></div>
    <button class="btn block primary" onclick="saveExerciseEdit('${id}')">${icon('i-check')}保存修改</button>`;
  document.getElementById('modalBg').classList.add('active');
}

function saveExerciseEdit(id){
  const ex = DB.exerciseLibrary.find(e=>e.id===id);
  if(!ex) return;
  ex.name = document.getElementById('exName').value.trim() || ex.name;
  ex.muscle = document.getElementById('exMuscle').value;
  ex.demoType = document.getElementById('exDemoType').value;
  ex.steps = document.getElementById('exSteps').value.split('\n').map(s=>s.trim()).filter(s=>s);
  ex.errors = document.getElementById('exErrors').value.split('\n').map(s=>s.trim()).filter(s=>s);
  saveDB();
  closeModal();
  render();
  toast('动作已更新');
}

function deleteExercise(id){
  if(!confirm('确认删除此动作？')) return;
  DB.exerciseLibrary = DB.exerciseLibrary.filter(e=>e.id!==id);
  saveDB();
  render();
  toast('已删除');
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
